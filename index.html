2{font-size:1.18rem;margin:0 0 3px} .hint{color:var(--muted);font-size:.9rem;margin:0}\n.media-panel{background:#f8fafc;border:1px dashed #b8c5da;border-radius:12px;padding:16px;margin:12px 0 18px}\n.media-title{font-weight:750;margin-bottom:7px}.media-controls{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.status{font-size:.88rem;color:var(--muted)}input[type=file]{max-width:100%;font:inherit;font-size:.9rem}\n.q{padding:15px 0;border-top:1px solid #edf1f6}.q:first-of-type{border-top:0}.qline{font-weight:600;margin-bottom:9px}.num{display:inline-block;color:var(--muted);min-width:28px;font-weight:750}\n.options{display:grid;gap:8px;margin-left:28px}.option{display:flex;align-items:flex-start;gap:9px;border:1px solid var(--line);border-radius:10px;padding:9px 11px;cursor:pointer;font-weight:400}.option:has(input:checked){border-color:var(--blue);background:#f2f6ff}.option input{margin-top:5px;accent-color:var(--blue)}\n.blank{display:inline-block;vertical-align:baseline;min-width:145px;max-width:100%;width:min(240px,100%);border:0;border-bottom:2px solid #8da2c5;border-radius:0;padding:4px 6px;background:#f8fafc;color:var(--ink);font:inherit;outline:none}.blank:focus{border-bottom-color:var(--blue);background:#eff4ff}.blank.short{width:135px;min-width:100px}.dialogue{font-size:1rem;line-height:2.25}.speaker{font-weight:800;color:#334e83;display:inline-block;min-width:104px}.dialogue-line{margin:4px 0}.inline-select{display:inline-block;vertical-align:middle;border:1px solid #aebed6;border-radius:8px;background:#f8fafc;padding:4px 7px;font:inherit;color:var(--ink);max-width:100%}\n.image-preview{display:none;max-width:100%;max-height:420px;object-fit:contain;border-radius:10px;margin-top:12px;background:#fff}\n.note{font-size:.88rem;color:var(--muted)}.bottom-actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin:20px 0}.result{display:none}.result h2{margin-bottom:10px}.result-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.result-item{background:#f8fafc;border:1px solid var(--line);padding:12px;border-radius:10px;overflow-wrap:anywhere}.result-item strong{display:block;font-size:.85rem;color:var(--muted);margin-bottom:4px}\nfooter{text-align:center;color:var(--muted);font-size:.85rem;padding:20px}\n@media(max-width:600px){.speaker{min-width:72px}.blank{min-width:110px;width:150px}.card{border-radius:12px}.options{margin-left:0}.qline .num{min-width:25px}}\n@media print{header{background:#fff;color:#111;padding:10px}.toolbar,.media-controls,.bottom-actions,footer{display:none!important}body{background:#fff}.card{box-shadow:none;break-inside:avoid}}\n</style>\n<script>\n/* Flexible answer matching: ignore case/punctuation, accept common contractions and number words. */\nfunction celesteNorm(value){\n let s=String(value??'').toLowerCase().replace(/[’‘]/g,\"'\").trim();\n const contractions=[[/\\bcan't\\b/g,'cannot'],[/\\bcannot\\b/g,'cannot'],[/\\bwon't\\b/g,'will not'],[/\\bdon't\\b/g,'do not'],[/\\bdoesn't\\b/g,'does not'],[/\\bdidn't\\b/g,'did not'],[/\\bisn't\\b/g,'is not'],[/\\baren't\\b/g,'are not'],[/\\bwasn't\\b/g,'was not'],[/\\bweren't\\b/g,'were not'],[/\\bhaven't\\b/g,'have not'],[/\\bhasn't\\b/g,'has not'],[/\\bhadn't\\b/g,'had not'],[/\\bwouldn't\\b/g,'would not'],[/\\bshouldn't\\b/g,'should not'],[/\\bcouldn't\\b/g,'could not'],[/\\bit's\\b/g,'it is'],[/\\bthey're\\b/g,'they are'],[/\\bwe're\\b/g,'we are'],[/\\byou're\\b/g,'you are'],[/\\bI'm\\b/gi,'i am'],[/\\bhe's\\b/g,'he is'],[/\\bshe's\\b/g,'she is'],[/\\bthat's\\b/g,'that is'],[/\\bthere's\\b/g,'there is'],[/\\bwhat's\\b/g,'what is'],[/\\bwho's\\b/g,'who is'],[/\\bwhere's\\b/g,'where is'],[/\\bhow's\\b/g,'how is'],[/\\bthey've\\b/g,'they have'],[/\\bwe've\\b/g,'we have'],[/\\byou've\\b/g,'you have'],[/\\bI've\\b/g,'i have'],[/\\bI'll\\b/g,'i will'],[/\\byou'll\\b/g,'you will'],[/\\bwe'll\\b/g,'we will'],[/\\bthey'll\\b/g,'they will'],[/\\bhe'll\\b/g,'he will'],[/\\bshe'll\\b/g,'she will']];\n for(const [pattern,replacement] of contractions)s=s.replace(pattern,replacement);\n const nums={zero:'0',oh:'0',one:'1',two:'2',three:'3',four:'4',five:'5',six:'6',seven:'7',eight:'8',nine:'9',ten:'10',eleven:'11',twelve:'12',thirteen:'13',fourteen:'14',fifteen:'15',sixteen:'16',seventeen:'17',eighteen:'18',nineteen:'19',twenty:'20',thirty:'30',forty:'40',fifty:'50',sixty:'60',seventy:'70',eighty:'80',ninety:'90'};\n s=s.replace(/\\b(zero|oh|one|two|three|four|five|six|seven|eight|nine|ten|eleven|twelve|thirteen|fourteen|fifteen|sixteen|seventeen|eighteen|nineteen|twenty|thirty|forty|fifty|sixty|seventy|eighty|ninety)\\b/g,w=>nums[w]);\n return s.replace(/[^a-z0-9\\s']/g,' ').replace(/\\s+/g,' ').trim();\n}\n<\/script>\n</head>\n<body>\n<div class=\"combined-nav\"><a href=\"../index.html\">← All units</a></div>\n<header><div class=\"head\"><div class=\"eyebrow\">CELESTE English School</div><h1>English Exam</h1><p class=\"sub\">Personal information · Greetings · Classroom objects · Prepositions</p></div></header>\n<main>\n<div class=\"toolbar\">\n  <div class=\"progress-wrap\"><div class=\"progress-label\"><span>Exam progress</span><span id=\"progressText\">0 of 25 responses</span></div><div class=\"progress\"><span id=\"progressBar\"></span></div></div>\n  <button class=\"secondary\" type=\"button\" onclick=\"window.print()\">Print exam</button>\n</div>\n<form id=\"examForm\">\n<section class=\"card\" id=\"sectionA\">\n<div class=\"section-head\"><div class=\"letter\">A</div><div><h2>Listen to the conversations</h2><p class=\"hint\">Check (✓) the correct answers. The audio can be started only twice.</p></div></div>\n<div class=\"media-panel\">\n  <div class=\"media-title\">Listening audio — upload your audio file</div>\n  <input type=\"file\" id=\"audioUpload\" accept=\"audio/*\" aria-label=\"Upload listening audio\">\n  <div class=\"media-controls\" style=\"margin-top:12px\"><button type=\"button\" class=\"primary\" id=\"playAudio\" disabled>▶ Play audio (2 plays left)</button><span class=\"status\" id=\"audioStatus\">No audio uploaded yet.</span></div>\n  <audio id=\"listeningAudio\" preload=\"none\"></audio>\n  <p class=\"note\">Playback starts from the beginning each time. Seeking and replay controls are not provided. Each complete play counts as one of the two allowed plays.</p>\n</div>\n<div class=\"q\"><div class=\"qline\"><span class=\"num\">1.</span> His first name is ———.</div><div class=\"options\">\n<label class=\"option\"><input type=\"radio\" name=\"a1\" value=\"Z.A.C.K.A.R.Y\"> Z.A.C.K.A.R.Y</label>\n<label class=\"option\"><input type=\"radio\" name=\"a1\" value=\"Z.A.C.H.A.R.Y\"> Z.A.C.H.A.R.Y</label>\n<label class=\"option\"><input type=\"radio\" name=\"a1\" value=\"Z.A.C.H.E.R.Y\"> Z.A.C.H.E.R.Y</label></div></div>\n<div class=\"q\"><div class=\"qline\"><span class=\"num\">2.</span> Sue's phone number is ———.</div><div class=\"options\">\n<label class=\"option\"><input type=\"radio\" name=\"a2\" value=\"718-555-8781\"> 718-555-8781</label>\n<label class=\"option\"><input type=\"radio\" name=\"a2\" value=\"718-555-8881\"> 718-555-8881</label>\n<label class=\"option\"><input type=\"radio\" name=\"a2\" value=\"718-555-8871\"> 718-555-8871</label></div></div>\n<div class=\"q\"><div class=\"qline\"><span class=\"num\">3.</span> The ——— is in his bag.</div><div class=\"options\">\n<label class=\"option\"><input type=\"radio\" name=\"a3\" value=\"CD player\"> CD player</label>\n<label class=\"option\"><input type=\"radio\" name=\"a3\" value=\"cell phone\"> cell phone</label>\n<label class=\"option\"><input type=\"radio\" name=\"a3\" value=\"camera\"> camera</label></div></div>\n<div class=\"q\"><div class=\"qline\"><span class=\"num\">4.</span> The man's wallet is ———.</div><div class=\"options\">\n<label class=\"option\"><input type=\"radio\" name=\"a4\" value=\"Under his desk\"> Under his desk</label>\n<label class=\"option\"><input type=\"radio\" name=\"a4\" value=\"in his pocket\"> in his pocket</label>\n<label class=\"option\"><input type=\"radio\" name=\"a4\" value=\"In his book bag\"> In his book bag</label></div></div>\n</section>\n<section class=\"card\" id=\"sectionB\">\n<div class=\"section-head\"><div class=\"letter\">B</div><div><h2>Complete the conversation</h2><p class=\"hint\">Use <em>my, your, his</em> or <em>her</em>. Type each answer directly in the blank.</p></div></div>\n<div class=\"dialogue\">\n<div class=\"dialogue-line\"><span class=\"speaker\">MATT:</span> Tony, this is my friend. <input class=\"blank\" name=\"b1\" aria-label=\"B1\" autocomplete=\"off\"> name is Jennifer Miller.</div>\n<div class=\"dialogue-line\"><span class=\"speaker\"></span> Jennifer is in <input class=\"blank\" name=\"b2\" aria-label=\"B2\" autocomplete=\"off\"> English class.</div>\n<div class=\"dialogue-line\"><span class=\"speaker\">TONY:</span> Nice to meet you.</div>\n<div class=\"dialogue-line\"><span class=\"speaker\"></span> What's <input class=\"blank\" name=\"b3\" aria-label=\"B3\" autocomplete=\"off\"> last name again?</div>\n<div class=\"dialogue-line\"><span class=\"speaker\">JENNIFER:</span> It's Miller.</div>\n</div>\n</section>\n<section class=\"card\" id=\"sectionC\">\n<div class=\"section-head\"><div class=\"letter\">C</div><div><h2>Complete the conversation</h2><p class=\"hint\">Type the missing words directly in the blanks.</p></div></div>\n<div class=\"dialogue\">\n<div class=\"dialogue-line\"><span class=\"speaker\">A:</span> Excuse me. <input class=\"blank\" name=\"c1\" aria-label=\"C1\" autocomplete=\"off\"> you Ms. Brown?</div>\n<div class=\"dialogue-line\"><span class=\"speaker\">B:</span> No, <input class=\"blank short\" name=\"c2\" aria-label=\"C2\" autocomplete=\"off\"> not. <input class=\"blank\" name=\"c3\" aria-label=\"C3\" autocomplete=\"off\"> over there.</div>\n<div class=\"dialogue-line\"><span class=\"speaker\"></span> My name is Nichole Parker.</div>\n<div class=\"dialogue-line\"><span class=\"speaker\">A:</span> Oh! I'm sorry. Well, <input class=\"blank\" name=\"c4\" aria-label=\"C4\" autocomplete=\"off\"> nice to meet you.</div>\n<div class=\"dialogue-line\"><span class=\"speaker\">B:</span> Nice to meet you.</div>\n</div>\n</section>\n<section class=\"card\" id=\"sectionD\">\n<div class=\"section-head\"><div class=\"letter\">D</div><div><h2>Check the correct response</h2><p class=\"hint\">Choose one answer for each question.</p></div></div>\n<div class=\"q\"><div class=\"qline\"><span class=\"num\">1.</span> Good-bye. Have a nice day.</div><div class=\"options\">\n<label class=\"option\"><input type=\"radio\" name=\"d1\" value=\"I'm just fine. Thank you.\"> I'm just fine. Thank you.</label>\n<label class=\"option\"><input type=\"radio\" name=\"d1\" value=\"It's nice to meet you.\"> It's nice to meet you.</label>\n<label class=\"option\"><input type=\"radio\" name=\"d1\" value=\"Thanks. You, too.\"> Thanks. You, too.</label></div></div>\n<div class=\"q\"><div class=\"qline\"><span class=\"num\">2.</span> See you later.</div><div class=\"options\">\n<label class=\"option\"><input type=\"radio\" name=\"d2\" value=\"I'm OK. Thanks you.\"> I'm OK. Thanks you.</label>\n<label class=\"option\"><input type=\"radio\" name=\"d2\" value=\"OK. Bye-bye.\"> OK. Bye-bye.</label>\n<label class=\"option\"><input type=\"radio\" name=\"d2\" value=\"Not bad. How are you?\"> Not bad. How are you?</label></div></div>\n<div class=\"q\"><div class=\"qline\"><span class=\"num\">3.</span> Hi. How are you?</div><div class=\"options\">\n<label class=\"option\"><input type=\"radio\" name=\"d3\" value=\"Not bad, thanks.\"> Not bad, thanks.</label>\n<label class=\"option\"><input type=\"radio\" name=\"d3\" value=\"Good night.\"> Good night.</label>\n<label class=\"option\"><input type=\"radio\" name=\"d3\" value=\"Nice to meet you, too.\"> Nice to meet you, too.</label></div></div>\n<div class=\"q\"><div class=\"qline\"><span class=\"num\">4.</span> Good evening, Beth.</div><div class=\"options\">\n<label class=\"option\"><input type=\"radio\" name=\"d4\" value=\"Hello. How are you, Mr. Smith?\"> Hello. How are you, Mr. Smith?</label>\n<label class=\"option\"><input type=\"radio\" name=\"d4\" value=\"Great. How about you, Mr. Smith?\"> Great. How about you, Mr. Smith?</label>\n<label class=\"option\"><input type=\"radio\" name=\"d4\" value=\"Good night. See you tomorrow. Mr. Smith.\"> Good night. See you tomorrow. Mr. Smith.</label></div></div>\n</section>\n<section class=\"card\" id=\"sectionE\">\n<div class=\"section-head\"><div class=\"letter\">E</div><div><h2>Circle the correct words</h2><p class=\"hint\">Choose the correct option from the dropdowns placed inside each sentence.</p></div></div>\n<div class=\"q\"><div class=\"qline\"><span class=\"num\">1.</span> A: What are <select class=\"inline-select\" name=\"e1a\" aria-label=\"E1 first choice\"><option value=\"\">(choose)</option><option>it</option><option>this</option><option>these</option></select>?</div>\n<div class=\"qline\" style=\"margin-left:28px\">B: <select class=\"inline-select\" name=\"e1b\" aria-label=\"E1 second choice\"><option value=\"\">(choose)</option><option>This</option><option>They're</option><option>It's</option></select> earrings.</div></div>\n<div class=\"q\"><div class=\"qline\"><span class=\"num\">2.</span> A: <select class=\"inline-select\" name=\"e2a\" aria-label=\"E2 first choice\"><option value=\"\">(choose)</option><option>Is this</option><option>This is</option><option>Are these</option></select> your sunglasses?</div>\n<div class=\"qline\" style=\"margin-left:28px\">B: No, <select class=\"inline-select\" name=\"e2b\" aria-label=\"E2 second choice\"><option value=\"\">(choose)</option><option>is</option><option>it's</option><option>they're</option></select> not.</div></div>\n<div class=\"q\"><div class=\"qline\"><span class=\"num\">3.</span> A: Is <select class=\"inline-select\" name=\"e3a\" aria-label=\"E3 first choice\"><option value=\"\">(choose)</option><option>the</option><option>this</option><option>they</option></select> a notebook?</div>\n<div class=\"qline\" style=\"margin-left:28px\">B: No, it isn’t. It's <select class=\"inline-select\" name=\"e3b\" aria-label=\"E3 second choice\"><option value=\"\">(choose)</option><option>a</option><option>an</option><option>the</option></select> address book.</div></div>\n</section>\n<section class=\"card\" id=\"sectionF\">\n<div class=\"section-head\"><div class=\"letter\">F</div><div><h2>Complete the conversations</h2><p class=\"hint\">Use the correct prepositions. One image supports all four questions.</p></div></div>\n<div class=\"media-panel\">\n<div class=\"media-title\">Question image — upload your image</div>\n<input type=\"file\" id=\"imageUpload\" accept=\"image/*\" aria-label=\"Upload question image\">\n<img id=\"imagePreview\" class=\"image-preview\" alt=\"Uploaded image for Section F\">\n<p class=\"note\" id=\"imageStatus\">No image uploaded yet.</p>\n</div>\n<div class=\"dialogue\">\n<div class=\"dialogue-line\"><span class=\"speaker\">1. A:</span> Where are the keys?</div>\n<div class=\"dialogue-line\"><span class=\"speaker\">B:</span> They're <input class=\"blank\" name=\"f1\" aria-label=\"F1\" autocomplete=\"off\"> the briefcase.</div>\n<div class=\"dialogue-line\" style=\"margin-top:12px\"><span class=\"speaker\">2. A:</span> Is the CD player behind the briefcase?</div>\n<div class=\"dialogue-line\"><span class=\"speaker\">B:</span> No, it's not. It's <input class=\"blank\" name=\"f2\" aria-label=\"F2\" autocomplete=\"off\"> the briefcase.</div>\n<div class=\"dialogue-line\" style=\"margin-top:12px\"><span class=\"speaker\">3. A:</span> Where's the newspaper?</div>\n<div class=\"dialogue-line\"><span class=\"speaker\">B:</span> It's <input class=\"blank\" name=\"f3\" aria-label=\"F3\" autocomplete=\"off\"> the briefcase.</div>\n<div class=\"dialogue-line\" style=\"margin-top:12px\"><span class=\"speaker\">4. A:</span> Are the books <input class=\"blank\" name=\"f4\" aria-label=\"F4\" autocomplete=\"off\"> the CD player?</div>\n<div class=\"dialogue-line\"><span class=\"speaker\">B:</span> Yes, they are.</div>\n</div>\n</section>\n<div class=\"bottom-actions\"><button type=\"button\" class=\"secondary\" id=\"clearBtn\">Clear answers</button><button type=\"submit\" class=\"primary\">Submit exam</button></div>\n</form>\n<section class=\"card result\" id=\"result\" aria-live=\"polite\"><h2>Exam submitted</h2><p>Your answers have been checked against the Unit 1–2 answer key. Written answers are checked without regard to capitalization and with extra spaces ignored.</p><h3 id=\"scoreHeading\"></h3><div class=\"result-grid\" id=\"resultGrid\"></div><div class=\"bottom-actions\"><button class=\"secondary\" type=\"button\" id=\"editBtn\">Return to exam</button><button class=\"primary\" type=\"button\" id=\"downloadBtn\">Download responses (.txt)</button></div></section>\n</main><footer>CELESTE English School · English Exam</footer>\n<script>\nconst form=document.getElementById('examForm');\nconst audioInput=document.getElementById('audioUpload'), audio=document.getElementById('listeningAudio');\nconst playBtn=document.getElementById('playAudio'), audioStatus=document.getElementById('audioStatus');\nlet playsLeft=2, audioUrl=null, submittedData=null;\nconst answerKey={a1:'Z.A.C.H.A.R.Y',a2:'718-555-8871',a3:'camera',a4:'Under his desk',b1:'Her',b2:'my',b3:'your',c1:'Are',c2:\"I'm\",c3:\"She's\",c4:\"it's\",d1:'Thanks. You, too.',d2:'OK. Bye-bye.',d3:'Not bad, thanks.',d4:'Hello. How are you, Mr. Smith?',e1a:'these',e1b:\"They're\",e2a:'Are these',e2b:\"they're\",e3a:'this',e3b:'an',f1:'on',f2:'beside',f3:'under',f4:'in front of'};\naudioInput.addEventListener('change',()=>{\n  if(audioUrl) URL.revokeObjectURL(audioUrl);\n  const file=audioInput.files[0];\n  if(!file){audio.removeAttribute('src');playBtn.disabled=true;audioStatus.textContent='No audio uploaded yet.';return;}\n  audioUrl=URL.createObjectURL(file);audio.src=audioUrl;playsLeft=2;playBtn.disabled=false;p olor:#334e83;display:inline-block;min-width:104px}.dialogue-line{margin:4px 0}.inline-select{display:inline-block;vertical-align:middle;border:1px solid #aebed6;border-radius:8px;background:#f8fafc;padding:4px 7px;font:inherit;color:var(--ink);max-width:100%}\n.image-preview{display:none;max-width:100%;max-height:420px;object-fit:contain;border-radius:10px;margin-top:12px;background:#fff}\n.note{font-size:.88rem;color:var(--muted)}.bottom-actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin:20px 0}.result{display:none}.result h2{margin-bottom:10px}.result-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.result-item{background:#f8fafc;border:1px solid var(--line);padding:12px;border-radius:10px;overflow-wrap:anywhere}.result-item strong{display:block;font-size:.85rem;color:var(--muted);margin-bottom:4px}\nfooter{text-align:center;color:var(--muted);font-size:.85rem;padding:20px}\n@media(max-width:600px){.speaker{min-width:72px}.blank{min-width:110px;width:150px}.card{border-radius:12px}.options{margin-left:0}.qline .num{min-width:25px}}\n@media print{header{background:#fff;color:#111;padding:10px}.toolbar,.media-controls,.bottom-actions,footer{display:none!important}body{background:#fff}.card{box-shadow:none;break-inside:avoid}}\n</style>\n<script>\n/* Flexible answer matching: ignore case/punctuation, accept common contractions and number words. */\nfunction celesteNorm(value){\n let s=String(value??'').toLowerCase().replace(/[’‘]/g,\"'\").trim();\n const contractions=[[/\\bcan't\\b/g,'cannot'],[/\\bcannot\\b/g,'cannot'],[/\\bwon't\\b/g,'will not'],[/\\bdon't\\b/g,'do not'],[/\\bdoesn't\\b/g,'does not'],[/\\bdidn't\\b/g,'did not'],[/\\bisn't\\b/g,'is not'],[/\\baren't\\b/g,'are not'],[/\\bwasn't\\b/g,'was not'],[/\\bweren't\\b/g,'were not'],[/\\bhaven't\\b/g,'have not'],[/\\bhasn't\\b/g,'has not'],[/\\bhadn't\\b/g,'had not'],[/\\bwouldn't\\b/g,'would not'],[/\\bshouldn't\\b/g,'should not'],[/\\bcouldn't\\b/g,'could not'],[/\\bit's\\b/g,'it is'],[/\\bthey're\\b/g,'they are'],[/\\bwe're\\b/g,'we are'],[/\\byou're\\b/g,'you are'],[/\\bI'm\\b/gi,'i am'],[/\\bhe's\\b/g,'he is'],[/\\bshe's\\b/g,'she is'],[/\\bthat's\\b/g,'that is'],[/\\bthere's\\b/g,'there is'],[/\\bwhat's\\b/g,'what is'],[/\\bwho's\\b/g,'who is'],[/\\bwhere's\\b/g,'where is'],[/\\bhow's\\b/g,'how is'],[/\\bthey've\\b/g,'they have'],[/\\bwe've\\b/g,'we have'],[/\\byou've\\b/g,'you have'],[/\\bI've\\b/g,'i have'],[/\\bI'll\\b/g,'i will'],[/\\byou'll\\b/g,'you will'],[/\\bwe'll\\b/g,'we will'],[/\\bthey'll\\b/g,'they will'],[/\\bhe'll\\b/g,'he will'],[/\\bshe'll\\b/g,'she will']];\n for(const [pattern,replacement] of contractions)s=s.replace(pattern,replacement);\n const nums={zero:'0',oh:'0',one:'1',two:'2',three:'3',four:'4',five:'5',six:'6',seven:'7',eight:'8',nine:'9',ten:'10',eleven:'11',twelve:'12',thirteen:'13',fourteen:'14',fifteen:'15',sixteen:'16',seventeen:'17',eighteen:'18',nineteen:'19',twenty:'20',thirty:'30',forty:'40',fifty:'50',sixty:'60',seventy:'70',eighty:'80',ninety:'90'};\n s=s.replace(/\\b(zero|oh|one|two|three|four|five|six|seven|eight|nine|ten|eleven|twelve|thirteen|fourteen|fifteen|sixteen|seventeen|eighteen|nineteen|twenty|thirty|forty|fifty|sixty|seventy|eighty|ninety)\\b/g,w=>nums[w]);\n return s.replace(/[^a-z0-9\\s']/g,' ').replace(/\\s+/g,' ').trim();\n}\n<\/script>\n</head>\n<body>\n<div class=\"combined-nav\"><a href=\"../index.html\">← All units</a></div>\n<header><div class=\"head\"><div class=\"eyebrow\">CELESTE English School</div><h1>English Exam · Units 3–4</h1><p class=\"sub\">Personal descriptions · Countries · Clothing · Present continuous</p></div></header>\n<main>\n<div class=\"toolbar\">\n  <div class=\"progress-wrap\"><div class=\"progress-label\"><span>Exam progress</span><span id=\"progressText\">0 of 25 responses</span></div><div class=\"progress\"><span id=\"progressBar\"></span></div></div>\n  <button class=\"secondary\" type=\"button\" onclick=\"window.print()\">Print exam</button>\n</div>\n<form id=\"examForm\">\n<section class=\"card\" id=\"sectionA\">\n<div class=\"section-head\"><div class=\"letter\">A</div><div><h2>Listen to the conversations</h2><p class=\"hint\">Check (✓) the correct answers. The audio can be started only twice.</p></div></div>\n<div class=\"media-panel\">\n<div class=\"media-title\">Listening audio — upload your audio file</div>\n<input type=\"file\" id=\"audioUpload\" accept=\"audio/*\" aria-label=\"Upload listening audio\">\n<div class=\"media-controls\" style=\"margin-top:12px\"><button type=\"button\" class=\"primary\" id=\"playAudio\" disabled>▶ Play audio (2 plays left)</button><span class=\"status\" id=\"audioStatus\">No audio uploaded yet.</span></div>\n<audio id=\"listeningAudio\" preload=\"none\"></audio>\n<p class=\"note\">Playback starts from the beginning each time. Seeking and replay controls are not provided. Each complete play counts as one of the two allowed plays.</p>\n</div>\n<div class=\"q\"><div class=\"qline\"><span class=\"num\">1.</span> Where is Justine from?</div><div class=\"options\">\n<label class=\"option\"><input type=\"radio\" name=\"a1\" value=\"She's from Canada.\"> She's from Canada.</label>\n<label class=\"option\"><input type=\"radio\" name=\"a1\" value=\"She's from France.\"> She's from France.</label>\n<label class=\"option\"><input type=\"radio\" name=\"a1\" value=\"She's from Italy.\"> She's from Italy.</label></div></div>\n<div class=\"q\"><div class=\"qline\"><span class=\"num\">2.</span> What's Mike like?</div><div class=\"options\">\n<label class=\"option\"><input type=\"radio\" name=\"a2\" value=\"He's friendly and a little quiet.\"> He's friendly and a little quiet.</label>\n<label class=\"option\"><input type=\"radio\" name=\"a2\" value=\"He's a little quiet, but very funny.\"> He's a little quiet, but very funny.</label>\n<label class=\"option\"><input type=\"radio\" name=\"a2\" value=\"He's a little quiet and very serious.\"> He's a little quiet and very serious.</label></div></div>\n<div class=\"q\"><div class=\"qline\"><span class=\"num\">3.</span> What's the weather like?</div><div class=\"options\">\n<label class=\"option\"><input type=\"radio\" name=\"a3\" value=\"It's very warm and sunny.\"> It's very warm and sunny.</label>\n<label class=\"option\"><input type=\"radio\" name=\"a3\" value=\"It's raining, but it's warm.\"> It's raining, but it's warm.</label>\n<label class=\"option\"><input type=\"radio\" name=\"a3\" value=\"It's very sunny, but it's cool.\"> It's very sunny, but it's cool.</label></div></div>\n<div class=\"q\"><div class=\"qline\"><span class=\"num\">4.</span> Is Sue wearing a blue dress?</div><div class=\"options\">\n<label class=\"option\"><input type=\"radio\" name=\"a4\" value=\"Yes, she is.\"> Yes, she is.</label>\n<label class=\"option\"><input type=\"radio\" name=\"a4\" value=\"No, she's not. She's wearing a swimsuit.\"> No, she's not. She's wearing a swimsuit.</label>\n<label class=\"option\"><input type=\"radio\" name=\"a4\" value=\"No, she's not. She's wearing a suit.\"> No, she's not. She's wearing a suit.</label></div></div>\n</section>\n<section class=\"card\" id=\"sectionB\">\n<div class=\"section-head\"><div class=\"letter\">B</div><div><h2>Read the answers. Then write the questions.</h2><p class=\"hint\">Type the complete question in the blank. Include the question mark.</p></div></div>\n<div class=\"dialogue\"><div class=\"dialogue-line\"><span class=\"speaker\">Example A:</span> What's your name?</div><div class=\"dialogue-line\"><span class=\"speaker\">B:</span> My name is Tim.</div><div class=\"dialogue-line\"><span class=\"speaker\">A:</span> Are your parents in Peru?</div><div class=\"dialogue-line\"><span class=\"speaker\">B:</span> No, they're not in Peru. They're in Canada.</div></div>\n<div class=\"q\"><div class=\"qline\"><span class=\"num\">1.</span> B: No, they're not from England. They're from Australia.</div><input class=\"blank\" style=\"width:min(100%,620px)\" name=\"b1\" aria-label=\"B1 complete question\" autocomplete=\"off\" placeholder=\"Write the question here\"></div>\n<div class=\"q\"><div class=\"qline\"><span class=\"num\">2.</span> B: We're from New York.</div><input class=\"blank\" style=\"width:min(100%,620px)\" name=\"b2\" aria-label=\"B2 complete question\" autocomplete=\"off\" placeholder=\"Write the question here\"></div>\n<div class=\"q\"><div class=\"qline\"><span class=\"num\">3.</span> B: I think she's twenty-two.</div><input class=\"blank\" style=\"width:min(100%,620px)\" name=\"b3\" aria-label=\"B3 complete question\" autocomplete=\"off\" placeholder=\"Write the question here\"></div>\n<div class=\"q\"><div class=\"qline\"><span class=\"num\">4.</span> B: No, my first language isn't Spanish. It's Portuguese.</div><input class=\"blank\" style=\"width:min(100%,620px)\" name=\"b4\" aria-label=\"B4 complete question\" autocomplete=\"off\" placeholder=\"Write the question here\"></div>\n<div class=\"q\"><div class=\"qline\"><span class=\"num\">5.</span> B: Yes, I'm Japanese. I'm from Tokyo.</div><input class=\"blank\" style=\"width:min(100%,620px)\" name=\"b5\" aria-label=\"B5 complete question\" autocomplete=\"off\" placeholder=\"Write the question here\"></div>\n<div class=\"q\"><div class=\"qline\"><span class=\"num\">6.</span> B: He's talkative and very friendly.</div><input class=\"blank\" style=\"width:min(100%,620px)\" name=\"b6\" aria-label=\"B6 complete question\" autocomplete=\"off\" placeholder=\"Write the question here\"></div>\n</section>\n<section class=\"card\" id=\"sectionC\">\n<div class=\"section-head\"><div class=\"letter\">C</div><div><h2>Circle the correct words</h2><p class=\"hint\">Choose the correct word in each sentence.</p></div></div>\n<div class=\"q\"><div class=\"qline\"><span class=\"num\">1.</span> Larry isn't serious. He's <select class=\"inline-select\" name=\"c1\" aria-label=\"C1\"><option value=\"\">(choose)</option><option>heavy</option><option>pretty</option><option>funny</option></select>.</div></div>\n<div class=\"q\"><div class=\"qline\"><span class=\"num\">2.</span> Jean is a really good student. She's very <select class=\"inline-select\" name=\"c2\" aria-label=\"C2\"><option value=\"\">(choose)</option><option>friendly</option><option>smart</option><option>thin</option></select>.</div></div>\n<div class=\"q\"><div class=\"qline\"><span class=\"num\">3.</span> Tom isn't very talkative. He's <select class=\"inline-select\" name=\"c3\" aria-label=\"C3\"><option value=\"\">(choose)</option><option>funny</option><option>good-looking</option><option>quiet</option></select>.</div></div>\n<div class=\"q\"><div class=\"qline\"><span class=\"num\">4.</span> My teacher isn't short. She's <select class=\"inline-select\" name=\"c4\" aria-label=\"C4\"><option value=\"\">(choose)</option><option>pretty</option><option>tall</option><option>heavy</option></select>.</div></div>\n<div class=\"q\"><div class=\"qline\"><span class=\"num\">5.</span> My brother is good-looking. He's <select class=\"inline-select\" name=\"c5\" aria-label=\"C5\"><option value=\"\">(choose)</option><option>interesting</option><option>pretty</option><option>handsome</option></select>.</div></div>\n</section>\n<section class=\"card\" id=\"sectionD\">\n<div class=\"section-head\"><div class=\"letter\">D</div><div><h2>Match the questions with the answers</h2><p class=\"hint\">Choose the matching letter for each question.</p></div></div>\n<div class=\"media-panel\"><div class=\"qline\">Answers</div><div>a. Maybe they're Katy's.</div><div>b. No, they aren't theirs. They're ours.</div><div>c. I think it's yours.</div><div>d. No, it's not hers. It's mine.</div><div>e. Yes, they're hers.</div></div>\n<div class=\"q\"><div class=\"qline\"><span class=\"num\">1.</span> Is this Sue's scarf?</div><select class=\"inline-select\" name=\"d1\" aria-label=\"D1 match\"><option value=\"\">Choose a–e</option><option value=\"a\">a</option><option value=\"b\">b</option><option value=\"c\">c</option><option value=\"d\">d</option><option value=\"e\">e</option></select></div>\n<div class=\"q\"><div class=\"qline\"><span class=\"num\">2.</span> Whose boots are these?</div><select class=\"inline-select\" name=\"d2\" aria-label=\"D2 match\"><option value=\"\">Choose a–e</option><option value=\"a\">a</option><option value=\"b\">b</option><option value=\"c\">c</option><option value=\"d\">d</option><option value=\"e\">e</option></select></div>\n<div class=\"q\"><div class=\"qline\"><span class=\"num\">3.</span> Are these Lisa's gloves?</div><select class=\"inline-select\" name=\"d3\" aria-label=\"D3 match\"><option value=\"\">Choose a–e</option><option value=\"a\">a</option><option value=\"b\">b</option><option value=\"c\">c</option><option value=\"d\">d</option><option value=\"e\">e</option></select></div>\n<div class=\"q\"><div class=\"qline\"><span class=\"num\">4.</span> Whose hat is this?</div><select class=\"inline-select\" name=\"d4\" aria-label=\"D4 match\"><option value=\"\">Choose a–e</option><option value=\"a\">a</option><option value=\"b\">b</option><option value=\"c\">c</option><option value=\"d\">d</option><option value=\"e\">e</option></select></div>\n<div class=\"q\"><div class=\"qline\"><span class=\"num\">5.</span> Are these Peter's and Kathy's coats?</div><select class=\"inline-select\" name=\"d5\" aria-label=\"D5 match\"><option value=\"\">Choose a–e</option><option value=\"a\">a</option><option value=\"b\">b</option><option value=\"c\">c</option><option value=\"d\">d</option><option value=\"e\">e</option></select></div>\n</section>\n<section class=\"card\" id=\"sectionE\">\n<div class=\"section-head\"><div class=\"letter\">E</div><div><h2>Complete the conversations</h2><p class=\"hint\">Use the correct present continuous form of the verbs in parentheses.</p></div></div>\n<div class=\"dialogue\">\n<div class=\"dialogue-line\"><span class=\"speaker\">1. A:</span> Are you wearing jeans?</div>\n<div class=\"dialogue-line\"><span class=\"speaker\">B:</span> No, I <input class=\"blank\" name=\"e1\" aria-label=\"E1\" autocomplete=\"off\"> (wear) a suit.</div>\n<div class=\"dialogue-line\" style=\"margin-top:14px\"><span class=\"speaker\">2. A:</span> Is Mr. Simms wearing a tie?</div>\n<div class=\"dialogue-line\"><span class=\"speaker\">B:</span> No, he <input class=\"blank\" name=\"e2\" aria-label=\"E2\" autocomplete=\"off\"> (not wear) a tie.</div>\n<div class=\"dialogue-line\" style=\"margin-top:14px\"><span class=\"speaker\">3. A:</span> Are Ed and Sue wearing sweaters?</div>\n<div class=\"dialogue-line\"><span class=\"speaker\">B:</span> No, they're not. It's very hot.</div>\n<div class=\"dialogue-line\"><span class=\"speaker\"></span> They <input class=\"blank\" name=\"e3\" aria-label=\"E3\" autocomplete=\"off\"> (wear) shorts and T-shirts.</div>\n<div class=\"dialogue-line\" style=\"margin-top:14px\"><span class=\"speaker\">4. A:</span> It <input class=\"blank\" name=\"e4a\" aria-label=\"E4 first blank\" autocomplete=\"off\"> (not rain).</div>\n<div class=\"dialogue-line\"><span class=\"speaker\">B:</span> You're right. It <input class=\"blank\" name=\"e4b\" aria-label=\"E4 second blank\" autocomplete=\"off\"> (snow).</div>\n</div>\n</section>\n<div class=\"bottom-actions\"><button type=\"button\" class=\"secondary\" id=\"clearBtn\">Clear answers</button><button type=\"submit\" class=\"primary\">Submit exam</button></div>\n</form>\n<section class=\"card result\" id=\"result\" aria-live=\"polite\"><h2>Exam submitted</h2><p>Your answers have been checked against the Unit 1–2 answer key. Written answers are checked without regard to capitalization and with extra spaces ignored.</p><h3 id=\"scoreHeading\"></h3><div class=\"result-grid\" id=\"resultGrid\"></div><div class=\"bottom-actions\"><button class=\"secondary\" type=\"button\" id=\"editBtn\">Return to exam</button><button class=\"primary\" type=\"button\" id=\"downloadBtn\">Download responses (.txt)</button></div></section>\n</main><footer>CELESTE English School · English Exam</footer>\n<script>\nconst form=document.getElementById('examForm');\nconst audioInput=document.getElementById('audioUpload'), audio=document.getElementById('listeningAudio');\nconst playBtn=document.getElementById('playAudio'), audioStatus=document.getElementById('audioStatus');\nlet playsLeft=2, audioUrl=null, submittedData=null;\nconst answerKey={a1:\"She's from Canada.\",a2:\"He's a little quiet, but very funny.\",a3:\"It's raining, but it's warm.\",a4:\"Yes, she is.\",b1:\"Are they from England?\",b2:\"Where are you from?\",b3:\"How old do you think she is?\",b4:\"Is your first language Spanish?\",b5:\"Are you Japanese?\",b6:\"What's he like?\",c1:\"funny\",c2:\"smart\",c3:\"quiet\",c4:\"tall\",c5:\"handsome\",d1:\"d\",d2:\"a\",d3:\"e\",d4:\"c\",d5:\"b\",e1:\"am wearing\",e2:\"isn't wearing\",e3:\"are wearing\",e4a:\"isn't raining\",e4b:\"is snowing\"};\naudioInput.addEventListener('change',()=>{\n  if(audioUrl) URL.revokeObjectURL(audioUrl);\n  const file=audioInput.files[0];\n  if(!file){audio.removeAttribute('src');playBtn.disabled=true;audioStatus.textContent='No audio uploaded yet.';return;}\n  audioUrl=URL.createObjectURL(file);audio.src=audioUrl;playsLeft=2;playBtn.disabled=false;playBtn.textContent='▶ Play audio (2 plays left)';audioStatus.textContent=file.name+' · Ready to play';\n});\nplayBtn.addEventListener('click',async()=>{\n  if(!audio.src||playsLeft<=0||audio.paused===false)return;\n  playsLeft--;playBtn.disabled=true;playBtn.textContent='▶ Play audio ('+playsLeft+' plays left)';\n  audio.currentTime=0;\n  try{await audio.play();audioStatus.textContent='Playing… Please listen carefully.';}catch(e){playsLeft++;playBtn.disabled=false;playBtn.textContent='▶ Play audio ('+playsLeft+' plays left)';audioStatus.textContent='Unable to play this file. Try another audio file.';}\n});\naudio.addEventListener('ended',()=>{audioStatus.textContent='Audio finished. '+playsLeft+' play'+(playsLeft===1?'':'s')+' left.';playBtn.disabled=playsLeft<=0;});\naudio.addEventListener('error',()=>{audioStatus.textContent='Could not load audio. Please choose a supported audio file.';});\ndocument.addEventListener('keydown',e=>{if(e.target===audio && ['ArrowLeft','ArrowRight','Home','End'].includes(e.key)){e.preventDefault();}});\nconst imageInput=document.getElementById('imageUpload'), preview=document.getElementById('imagePreview');\nlet imageUrl=null;\nimageInput.addEventListener('change',()=>{\n if(imageUrl)URL.revokeObjectURL(imageUrl);\n const file=imageInput.files[0];if(!file){preview.style.display='none';return;}\n imageUrl=URL.createObjectURL(file);preview.src=imageUrl;preview.style.display='block';document.getElementById('imageStatus').textContent=file.name;\n});\nconst fields=[...form.querySelectorAll('input:not([type=file]), select')];\nfunction updateProgress(){let count=fields.filter(el=>el.type==='radio'?el.checked:el.value.trim()!=='').length;let total=new Set(fields.map(el=>el.type==='radio'?el.name:el.name)).size;document.getElementById('progressText').textContent=count+' responses entered';document.getElementById('progressBar').style.width=(count/26*100)+'%';}\nform.addEventListener('input',updateProgress);form.addEventListener('change',updateProgress);\nfunction collect(){const data=[];const seen=new Set();for(const el of fields){if(!el.name||seen.has(el.name))continue;seen.add(el.name);let val='';if(el.type==='radio'){const checked=form.querySelector('input[name=\"'+el.name+'\"]:checked');val=checked?checked.value:'';}else val=el.value;data.push({name:el.name,value:val});}return data;}\nfunction labelFor(name){return ({a1:'A1 · Justine’s country',a2:'A2 · Mike’s personality',a3:'A3 · Weather',a4:'A4 · Sue’s clothes',b1:'B1 · Write the question',b2:'B2 · Write the question',b3:'B3 · Write the question',b4:'B4 · Write the question',b5:'B5 · Write the question',b6:'B6 · Write the question',c1:'C1 · Correct word',c2:'C2 · Correct word',c3:'C3 · Correct word',c4:'C4 · Correct word',c5:'C5 · Correct word',d1:'D1 · Match',d2:'D2 · Match',d3:'D3 · Match',d4:'D4 · Match',d5:'D5 · Match',e1:'E1 · Present continuous',e2:'E2 · Present continuous',e3:'E3 · Present continuous',e4a:'E4 · First verb',e4b:'E4 · Second verb'})[name]||name;}\nform.addEventListener('submit',e=>{e.preventDefault();submittedData=collect();const grid=document.getElementById('resultGrid');grid.innerHTML='';let score=0,total=Object.keys(answerKey).length;\nsubmittedData.forEach(item=>{const expected=answerKey[item.name];const norm=v=>celesteNorm(v);const correct=norm(item.value)===norm(expected);if(correct)score++;const div=document.createElement('div');div.className='result-item';div.style.borderColor=correct?'#72c7a7':(item.value?'#f0b7b7':'#e2e8f0');const strong=document.createElement('strong');strong.textContent=labelFor(item.name)+' · '+(correct?'Correct':(item.value?'Incorrect':'Not answered'));const val=document.createElement('span');val.textContent='Your answer: '+(item.value||'Not answered');const ans=document.createElement('div');ans.style.marginTop='5px';ans.style.fontSize='.9rem';ans.style.color='#087f5b';ans.textContent='Correct answer: '+expected;div.append(strong,val,ans);grid.appendChild(div);});\ndocument.getElementById('scoreHeading').textContent='Score: '+score+' / '+total+' ('+Math.round(score/total*100)+'%)';document.getElementById('result').style.display='block';document.getElementById('result').scrollIntoView({behavior:'smooth'});});\ndocument.getElementById('editBtn').addEventListener('click',()=>{document.getElementById('result').style.display='none';form.scrollIntoView({behavior:'smooth'});});\ndocument.getElementById('clearBtn').addEventListener('click',()=>{if(confirm('Clear all exam answers?')){form.reset();updateProgress();document.getElementById('result').style.display='none';}});\ndocument.getElementById('downloadBtn').addEventListener('click',()=>{if(!submittedData)return;const textOut='CELESTE English School — Unit 3–4 English Exam Responses\\n\\nScore: '+submittedData.filter(x=>String(x.value||'').trim().replace(/\\\\s+/g,' ').toLowerCase()===String(answerKey[x.name]).trim().replace(/\\\\s+/g,' ').toLowerCase()).length+' / '+Object.keys(answerKey).length+'\\n\\n'+submittedData.map(x=>labelFor(x.name)+': '+(x.value||'Not answered')+' | Correct answer: '+answerKey[x.name]).join('\\n')+'\\n';const blob=new Blob([textOut],{type:'text/plain;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='english-exam-responses.txt';a.click();URL.revokeObjectURL(url);});\nupdateProgress();\n<\/script>\n<style>.combined-nav{padding:9px 16px;background:#fff;border-bottom:1px solid #ddd;font:700 14px system-ui}.combined-nav a{color:#8e302d;text-decoration:none}.celeste-print-result{display:flex;align-items:center;justify-content:center;width:max-content;max-width:100%;margin:18px auto;padding:12px 18px;border:0;border-radius:9px;background:#8e302d;color:#fff;font-weight:800;cursor:pointer}@media print{.combined-nav,.celeste-print-result,button[type=submit],input[type=file],audio{display:none!important}body{background:#fff!important}}</style><script>document.addEventListener('DOMContentLoaded',function(){var a=document.querySelector('audio');if(a&&!a.getAttribute('src')){a.src='audio/U3-4_A1.mp3';a.load();}var b=document.createElement('button');b.type='button';b.className='celeste-print-result';b.textContent='Print as PDF';b.hidden=true;b.onclick=function(){window.print()};document.body.appendChild(b);var f=document.querySelector('form');if(f)f.addEventListener('submit',function(){setTimeout(function(){b.hidden=false},200)});});<\/script>\n<script>\ndocument.addEventListener('DOMContentLoaded', function() {\n  const audioPath = 'audio/U3-4_A1.mp3';\n  const audio = document.getElementById('listeningAudio') || document.getElementById('audio');\n  if (audio) {\n    audio.src = audioPath;\n    audio.load();\n    audio.style.display = 'block';\n    audio.controls = !doc ixty:'60',seventy:'70',eighty:'80',ninety:'90'};\n s=s.replace(/\\b(zero|oh|one|two|three|four|five|six|seven|eight|nine|ten|eleven|twelve|thirteen|fourteen|fifteen|sixteen|seventeen|eighteen|nineteen|twenty|thirty|forty|fifty|sixty|seventy|eighty|ninety)\\b/g,w=>nums[w]);\n return s.replace(/[^a-z0-9\\s']/g,' ').replace(/\\s+/g,' ').trim();\n}\n<\/script>\n</head>\n<body>\n<div class=\"combined-nav\"><a href=\"../index.html\">← All units</a></div>\n<header><div class=\"head\"><div class=\"eyebrow\">CELESTE English School</div><h1>English Quiz · Units 5–6</h1><p class=\"sub\">Daily routines · Telling time · Present continuous · Reading comprehension</p></div></header>\n<main>\n<div class=\"toolbar\">\n  <div class=\"progress-wrap\"><div class=\"progress-label\"><span>Exam progress</span><span id=\"progressText\">0 of 25 responses</span></div><div class=\"progress\"><span id=\"progressBar\"></span></div></div>\n  <button class=\"secondary\" type=\"button\" onclick=\"window.print()\">Print exam</button>\n</div>\n<form id=\"examForm\">\n<section class=\"card\" id=\"sectionA\">\n<div class=\"section-head\"><div class=\"letter\">A</div><div><h2>Listen to the conversations</h2><p class=\"hint\">Complete the sentences. The audio can be started only twice.</p></div></div>\n<div class=\"media-panel\">\n<div class=\"media-title\">Listening audio — upload your audio file</div>\n<input type=\"file\" id=\"audioUpload\" accept=\"audio/*\" aria-label=\"Upload listening audio\">\n<div class=\"media-controls\" style=\"margin-top:12px\"><button type=\"button\" class=\"primary\" id=\"playAudio\" disabled>▶ Play audio (2 plays left)</button><span class=\"status\" id=\"audioStatus\">No audio uploaded yet.</span></div>\n<audio id=\"listeningAudio\" preload=\"none\"></audio>\n<p class=\"note\">Playback starts from the beginning each time. Seeking and replay controls are not provided. Each complete play counts as one of the two allowed plays.</p>\n</div>\n<div class=\"q\"><div class=\"qline\"><span class=\"num\">1.</span> On Saturdays, Judy <input class=\"blank\" name=\"a1\" aria-label=\"A1\" autocomplete=\"off\"> at 4:30 A.M.</div></div>\n<div class=\"q\"><div class=\"qline\"><span class=\"num\">2.</span> Rich <input class=\"blank\" name=\"a2\" aria-label=\"A2\" autocomplete=\"off\"> with his brother.</div></div>\n<div class=\"q\"><div class=\"qline\"><span class=\"num\">3.</span> On Sundays, Tracy <input class=\"blank\" name=\"a3\" aria-label=\"A3\" autocomplete=\"off\"> with her family.</div></div>\n<div class=\"q\"><div class=\"qline\"><span class=\"num\">4.</span> On Monday, Wednesday, and Friday, Greg <input class=\"blank\" name=\"a4\" aria-label=\"A4\" autocomplete=\"off\"> to school.</div></div>\n</section>\n<section class=\"card\" id=\"sectionB\">\n<div class=\"section-head\"><div class=\"letter\">B</div><div><h2>Complete the sentences</h2><p class=\"hint\">Upload the clock image. Type the missing words directly in the sentences.</p></div></div>\n<div class=\"media-panel\"><div class=\"media-title\">Clock image — upload your image</div><input type=\"file\" id=\"imageUpload\" accept=\"image/*\" aria-label=\"Upload clock image\"><img id=\"imagePreview\" class=\"image-preview\" alt=\"Uploaded clock image for Section B\"><p class=\"note\" id=\"imageStatus\">No image uploaded yet.</p></div>\n<div class=\"q\"><div class=\"qline\"><span class=\"num\">1.</span> It's <input class=\"blank\" name=\"b1\" aria-label=\"B1\" autocomplete=\"off\"> twelve.</div></div>\n<div class=\"q\"><div class=\"qline\"><span class=\"num\">2.</span> It's <input class=\"blank\" name=\"b2\" aria-label=\"B2\" autocomplete=\"off\"> five.</div></div>\n<div class=\"q\"><div class=\"qline\"><span class=\"num\">3.</span> It's seven-<input class=\"blank\" name=\"b3\" aria-label=\"B3\" autocomplete=\"off\">.</div></div>\n</section>\n<section class=\"card\" id=\"sectionC\">\n<div class=\"section-head\"><div class=\"letter\">C</div><div><h2>Complete the conversations with questions</h2><p class=\"hint\">Use <em>who, what,</em> or <em>where</em> and the words in parentheses. Type the complete question.</p></div></div>\n<div class=\"dialogue\"><div class=\"dialogue-line\"><span class=\"speaker\">Example A:</span> What's Steve doing? (Steve / do)</div><div class=\"dialogue-line\"><span class=\"speaker\">B:</span> He's making pizza.</div></div>\n<div class=\"q\"><div class=\"qline\"><span class=\"num\">1.</span> (Anne and Mary / study)</div><div class=\"dialogue-line\"><span class=\"speaker\">A:</span> <input class=\"blank\" style=\"width:min(100%,620px)\" name=\"c1\" aria-label=\"C1 complete question\" autocomplete=\"off\" placeholder=\"Write the complete question\">?</div><div class=\"dialogue-line\"><span class=\"speaker\">B:</span> Math and science.</div></div>\n<div class=\"q\"><div class=\"qline\"><span class=\"num\">2.</span> (James / work)</div><div class=\"dialogue-line\"><span class=\"speaker\">A:</span> <input class=\"blank\" style=\"width:min(100%,620px)\" name=\"c2\" aria-label=\"C2 complete question\" autocomplete=\"off\" placeholder=\"Write the complete question\">?</div><div class=\"dialogue-line\"><span class=\"speaker\">B:</span> In an office.</div></div>\n<div class=\"q\"><div class=\"qline\"><span class=\"num\">3.</span> (eat breakfast)</div><div class=\"dialogue-line\"><span class=\"speaker\">A:</span> <input class=\"blank\" style=\"width:min(100%,620px)\" name=\"c3\" aria-label=\"C3 complete question\" autocomplete=\"off\" placeholder=\"Write the complete question\">?</div><div class=\"dialogue-line\"><span class=\"speaker\">B:</span> Mr. and Mrs. Park.</div></div>\n</section>\n<section class=\"card\" id=\"sectionD\">\n<div class=\"section-head\"><div class=\"letter\">D</div><div><h2>Match the verbs with the phrases</h2><p class=\"hint\">Choose the phrase that completes each verb.</p></div></div>\n<div class=\"media-panel\"><div class=\"qline\">Phrases</div><div>a. a bike</div><div>b. a walk</div><div>c. dinner</div><div>d. television</div><div>e. tennis</div><div>f. to the movies</div><p class=\"note\">Example: have breakfast</p></div>\n<div class=\"q\"><div class=\"qline\"><span class=\"num\">1.</span> Eat <select class=\"inline-select\" name=\"d1\" aria-label=\"D1\"><option value=\"\">Choose a–f</option><option value=\"a\">a. a bike</option><option value=\"b\">b. a walk</option><option value=\"c\">c. dinner</option><option value=\"d\">d. television</option><option value=\"e\">e. tennis</option><option value=\"f\">f. to the movies</option></select></div></div>\n<div class=\"q\"><div class=\"qline\"><span class=\"num\">2.</span> Go <select class=\"inline-select\" name=\"d2\" aria-label=\"D2\"><option value=\"\">Choose a–f</option><option value=\"a\">a. a bike</option><option value=\"b\">b. a walk</option><option value=\"c\">c. dinner</option><option value=\"d\">d. television</option><option value=\"e\">e. tennis</option><option value=\"f\">f. to the movies</option></select></div></div>\n<div class=\"q\"><div class=\"qline\"><span class=\"num\">3.</span> Play <select class=\"inline-select\" name=\"d3\" aria-label=\"D3\"><option value=\"\">Choose a–f</option><option value=\"a\">a. a bike</option><option value=\"b\">b. a walk</option><option value=\"c\">c. dinner</option><option value=\"d\">d. television</option><option value=\"e\">e. tennis</option><option value=\"f\">f. to the movies</option></select></div></div>\n<div class=\"q\"><div class=\"qline\"><span class=\"num\">4.</span> Ride <select class=\"inline-select\" name=\"d4\" aria-label=\"D4\"><option value=\"\">Choose a–f</option><option value=\"a\">a. a bike</option><option value=\"b\">b. a walk</option><option value=\"c\">c. dinner</option><option value=\"d\">d. television</option><option value=\"e\">e. tennis</option><option value=\"f\">f. to the movies</option></select></div></div>\n<div class=\"q\"><div class=\"qline\"><span class=\"num\">5.</span> Take <select class=\"inline-select\" name=\"d5\" aria-label=\"D5\"><option value=  and starts his first job at 5:30. He finishes that job at 8:00 A.M. Then he eats breakfast. Joseph goes to class from 10 A.M. to 3:00 P.M. He doesn't have for lunch but he eats dinner. Then he starts his second job. He drives a bus from 4:00 to 9:00 at night. After work, he goes home and studies from 10:00 until midnight. Then he goes to bed and sleeps.</p></div>\n<div class=\"q\"><div class=\"qline\"><span class=\"num\">1.</span> Joseph — select two.</div><div class=\"options\">\n<label class=\"option\"><input type=\"checkbox\" name=\"f1\" value=\"Is a student.\" data-group=\"f1\"> Is a student.</label>\n<label class=\"option\"><input type=\"checkbox\" name=\"f1\" value=\"Has one job.\" data-group=\"f1\"> Has one job.</label>\n<label class=\"option\"><input type=\"checkbox\" name=\"f1\" value=\"Takes the bus.\" data-group=\"f1\"> Takes the bus.</label>\n<label class=\"option\"><input type=\"checkbox\" name=\"f1\" value=\"Studies at night.\" data-group=\"f1\"> Studies at night.</label></div></div>\n<div class=\"q\"><div class=\"qline\"><span class=\"num\">2.</span> Joseph works from — select two.</div><div class=\"options\">\n<label class=\"option\"><input type=\"checkbox\" name=\"f2\" value=\"5:30 A.M. to 8:00 A.M.\" data-group=\"f2\"> 5:30 A.M. to 8:00 A.M.</label>\n<label class=\"option\"><input type=\"checkbox\" name=\"f2\" value=\"10 A.M. to 3:00 P.M.\" data-group=\"f2\"> 10 A.M. to 3:00 P.M.</label>\n<label class=\"option\"><input type=\"checkbox\" name=\"f2\" value=\"4:00 P.M. to 9:00 P.M.\" data-group=\"f2\"> 4:00 P.M. to 9:00 P.M.</label>\n<label class=\"option\"><input type=\"checkbox\" name=\"f2\" value=\"10:00 P.M. to midnight.\" data-group=\"f2\"> 10:00 P.M. to midnight.</label></div></div>\n<div class=\"q\"><div class=\"qline\"><span class=\"num\">3.</span> Joseph eats — select two.</div><div class=\"options\">\n<label class=\"option\"><input type=\"checkbox\" name=\"f3\" value=\"Breakfast.\" data-group=\"f3\"> Breakfast.</label>\n<label class=\"option\"><input type=\"checkbox\" name=\"f3\" value=\"Dinner.\" data-group=\"f3\"> Dinner.</label>\n<label class=\"option\"><input type=\"checkbox\" name=\"f3\" value=\"Lunch.\" data-group=\"f3\"> Lunch.</label>\n<label class=\"option\"><input type=\"checkbox\" name=\"f3\" value=\"Late at night.\" data-group=\"f3\"> Late at night.</label></div></div>\n</section>\n<div class=\"bottom-actions\"><button type=\"button\" class=\"secondary\" id=\"clearBtn\">Clear answers</button><button type=\"submit\" class=\"primary\">Submit quiz</button></div>\n</form>\n<section class=\"card result\" id=\"result\" aria-live=\"polite\"><h2>Exam submitted</h2><p>Your answers have been checked against the Unit 1–2 answer key. Written answers are checked without regard to capitalization and with extra spaces ignored.</p><h3 id=\"scoreHeading\"></h3><div class=\"result-grid\" id=\"resultGrid\"></div><div class=\"bottom-actions\"><button class=\"secondary\" type=\"button\" id=\"editBtn\">Return to exam</button><button class=\"primary\" type=\"button\" id=\"downloadBtn\">Download responses (.txt)</button></div></section>\n</main><footer>CELESTE English School · English Exam</footer>\n<script>\nconst form=document.getElementById('examForm');\nconst audioInput=document.getElementById('audioUpload'), audio=document.getElementById('listeningAudio');\nconst playBtn=document.getElementById('playAudio'), audioStatus=document.getElementById('audioStatus');\nlet playsLeft=2, audioUrl=null, submittedData=null;\nconst answerKey={a1:\"wakes up\",a2:\"lives\",a3:\"ate lunch\",a4:\"take a bus\",b1:\"fifteen to\",b2:\"twenty to\",b3:\"eight\",c1:\"What are Anne and Mary studying?\",c2:\"Where does James work?\",c3:\"Who eats breakfast?\",d1:\"c\",d2:\"f\",d3:\"e\",d4:\"a\",d5:\"b\",d6:\"d\",e1:\"Does\",e2:\"has\",e3:\"go\",e4:\"on\",e5:\"is sleeping\",e6:\"studying\",f1:[\"Is a student.\",\"Studies at night.\"],f2:[\"5:30 A.M. to 8:00 A.M.\",\"4:00 P.M. to 9:00 P.M.\"],f3:[\"Breakfast.\",\"Dinner.\"]};\naudioInp cument.getElementById('audio');\n  if (audio) {\n    audio.src = audioPath;\n    audio.load();\n    audio.style.display = 'block';\n    audio.controls = !document.getElementById('playAudio');\n    const playBtn = document.getElementById('playAudio');\n    const status = document.getElementById('audioStatus') || document.getElementById('playCount');\n    if (playBtn) { playBtn.disabled = false; playBtn.textContent = '▶ Play audio (2 plays left)'; }\n    if (status) status.textContent = 'Audio path: audio/U5-6_A1.mp3';\n  }\n  const img = document.getElementById('imagePreview');\n  if (img) { img.src = 'images/u5-6-time.png'; img.style.display = 'block'; img.alt = 'Clock image for Section B'; const status = document.getElementById('imageStatus'); if(status) status.textContent = 'Loaded from images/u5-6-time.png'; }\n});\n<\/script>\n<style>\n/* CELESTE submitted-result panel */\n#result,#results{box-sizing:border-box;max-width:1000px;margin:28px auto;padding:clamp(20px,4vw,36px);background:#fff;border:1px solid #e6e8ee;border-radius:18px;box-shadow:0 12px 36px rgba(25,35,55,.09);color:#202638}\n#result h2,#results h2{margin:0 0 12px;color:#8e302d;font-size:clamp(1.5rem,3vw,2rem);font-weight:800;letter-spacing:-.02em}\n#scoreHeading,#score{display:block;margin:12px 0 20px;font-size:1.2rem;font-weight:800;color:#202638}\n#resultGrid,#feedback{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:12px}\n#resultGrid .result-item,#feedback .feedback{box-sizing:border-box;padding:15px;border:1px solid #f0b7b7;border-left:5px solid #c94a4a;border-radius:12px;background:#fff8f8;line-height:1.55;overflow-wrap:anywhere}\n#resultGrid .result-item strong,#feedback .feedback strong{display:block;margin-bottom:5px;color:#9f2f2f}\n.celeste-print-result{display:flex;align-items:center;justify-content:center;gap:8px;width:max-content;max-width:100%;margin:22px auto 0;padding:13px 22px;border:0;border-radius:10px;background:#8e302d;color:#fff;font-size:1re
