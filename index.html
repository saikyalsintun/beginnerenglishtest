#feedback .feedback{box-sizing:border-box;padding:15px;border:1px solid #f0b7b7;border-left:5px solid #c94a4a;border-radius:12px;background:#fff8f8;line-height:1.55;overflow-wrap:anywhere}\n#resultGrid .result-item strong,#feedback .feedback strong{display:block;margin-bottom:5px;color:#9f2f2f}\n.celeste-print-result{display:flex;align-items:center;justify-content:center;gap:8px;width:max-content;max-width:100%;margin:22px auto 0;padding:13px 22px;border:0;border-radius:10px;background:#8e302d;color:#fff;font-size:1rem;font-weight:800;cursor:pointer;box-shadow:0 4px 12px rgba(142,48,45,.2)}\n.celeste-print-result:hover{background:#702421}\n@media(max-width:600px){#result,#results{margin:16px 8px;padding:18px;border-radius:14px}#resultGrid,#feedback{grid-template-columns:1fr}.celeste-print-result{width:max-content;max-width:100%;margin-left:auto;margin-right:auto}}\n@media print{body{background:#fff!important}#result,#results{max-width:none;margin:0;padding:0;border:0;border-radius:0;box-shadow:none}#resultGrid,#feedback{display:block}#resultGrid .result-item,#feedback .feedback{break-inside:avoid;margin:0 0 10px}.combined-nav,.celeste-print-result,button,input[type=file],audio,footer{display:none!important}}\n</style>\n<script>\n(function(){\n function setupResultView(){\n  const result=document.getElementById('result')||document.getElementById('results');\n  if(!result)return;\n  const heading=result.querySelector('h2');if(heading && heading.textContent!=='Exam submitted')heading.textContent='Exam submitted';\n  function cleanAndStyle(){\n   // Keep only incorrect / unanswered items; never reveal the answer key.\n   const grid=document.getElementById('resultGrid');\n   if(grid){[...grid.children].forEach(card=>{\n    const label=card.querySelector('strong');\n    if(label && /·\\s*Correct\\s*$/.test(label.textContent) && !/Incorrect/.test(label.textContent)){card.remove();return;}\n    [...card.querySelectorAll('*')].forEach(el=>{if(el.children.length===0 && /^\\s*Correct answer\\s*:/i.test(el.textContent||''))el.remove();});\n    card.querySelectorAll('.small').forEach(el=>el.remove());\n   });}\n   const feedback=document.getElementById('feedback');\n   if(feedback){[...feedback.children].forEach(card=>{\n    if(card.querySelector('.correct')){card.remove();return;}\n    card.querySelectorAll('.small').forEach(el=>el.remove());\n    [...card.querySelectorAll('*')].forEach(el=>{if(el.children.length===0 && /^\\s*Correct answer\\s*:/i.test(el.textContent||''))el.remove();});\n    card.innerHTML=card.innerHTML.replace(/<br\\s*\\/?><span[^>]*>\\s*Correct answer:[\\s\\S]*?<\\/span>/gi,'');\n   });}\n   // Remove text-response downloads and secondary result actions.\n   result.querySelectorAll('#downloadBtn,button[id=\"editBtn\"]').forEach(el=>el.remove());\n   // Some older pages put result actions in a shared action row.\n   result.querySelectorAll('.bottom-actions').forEach(row=>{if(!row.querySelector('button:not(.celeste-print-result)'))row.remove();});\n   // Keep exactly one PDF button in the submitted-result panel.\n   document.querySelectorAll('body > .celeste-print-result').forEach(el=>el.remove());\n   let printBtn=result.querySelector('.celeste-print-result');\n   if(!printBtn){printBtn=document.createElement('button');printBtn.type='button';printBtn.className='celeste-print-result';printBtn.textContent='Print as PDF';printBtn.addEventListener('click',()=>window.print());result.appendChild(printBtn);}\n   else {if(printBtn.textContent!=='Print as PDF')printBtn.textContent='Print as PDF';printBtn.hidden=false;}\n  }\n  // Wait until the original grading script has rendered its result.\n  const form=document.querySelector('form');if(form)form.addEventListener('submit',()=>setTimeout(cleanAndStyle,80));\n  const observer=new MutationObserver(()=>{if(result.style.display!=='none' && result.offsetHeight)cleanAndStyle();});\n  observer.observe(result,{childList:true,subtree:true});\n  if(result.style.display!=='none' && result.offsetHeight)cleanAndStyle();\n }\n if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',setupResultView);else setupResultView();\n})();\n<\/script>\n<script>\n(function(){\n  window.print=function(){try{parent.postMessage({type:'celeste-print-request'},'*')}catch(e){}};\n  function h(){try{parent.postMessage({type:'celeste-height',height:document.documentElement.scrollHeight},'*')}catch(e){}}\n  addEventListener('load',h);setTimeout(h,250);setTimeout(h,1000);\n  if('ResizeObserver'in window)new ResizeObserver(h).observe(document.documentElement);\n})();\n<\/script></body></html>", "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\"><meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>CELESTE English School — Units 11–12 Quiz</title>\n<style>\n:root{--navy:#172554;--blue:#2563eb;--ink:#1f2937;--muted:#64748b;--line:#dbe3ef;--green:#15803d;--red:#b91c1c}\n*{box-sizing:border-box}body{margin:0;background:#f3f6fb;color:var(--ink);font:16px/1.55 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}\nheader{background:linear-gradient(135deg,#172554,#1d4ed8);color:white;padding:28px 18px}.wrap{max-width:980px;margin:auto;padding:0 16px}header h1{margin:0;font-size:clamp(1.5rem,4vw,2.25rem)}header p{margin:5px 0 0;color:#dbeafe}\nmain{padding:22px 0 50px}.instructions,section,#results{background:white;border:1px solid var(--line);border-radius:14px;padding:18px;margin:16px 0;box-shadow:0 3px 12px #0f172a08}\nh2{font-size:1.15rem;margin:0 0 12px;color:var(--navy)}.sub,.small{color:var(--muted);font-size:.92rem}.sub{margin-top:-6px}.q{padding:11px 0;border-top:1px solid #edf1f7}.q:first-of-type{border-top:0}\ninput[type=text],select{font:inherit;border:1px solid #cbd5e1;border-radius:8px;padding:7px 10px;background:white;max-width:100%}input[type=text]{width:min(100%,480px)}.inline{width:155px!important;display:inline-block;margin:3px 2px}\n.choice{display:flex;gap:9px;align-items:flex-start;margin:7px 0}.choice input{margin-top:6px}\n.actions{display:flex;flex-wrap:wrap;gap:10px;margin:20px 0}.btn{border:0;border-radius:10px;padding:11px 17px;font:inherit;font-weight:650;cursor:pointer}.primary{background:var(--blue);color:white}.secondary{background:#e2e8f0;color:#0f172a}\n#results{display:none;border:2px solid var(--blue)}#score{font-size:1.5rem;font-weight:800;color:var(--navy)}.feedback{margin:10px 0;padding:10px 12px;border-radius:8px;background:#f8fafc}.correct{color:var(--green);font-weight:700}.incorrect{color:var(--red);font-weight:700}\narticle{border-left:4px solid #93c5fd;padding:12px 16px;background:#f8fbff;border-radius:0 10px 10px 0}.meds{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}.med{border:1px solid var(--line);border-radius:10px;padding:12px;text-align:center;font-weight:700;background:#fafcff}.med span{display:block;font-size:.8rem;color:var(--muted);font-weight:400}\nfooter{text-align:center;color:var(--muted);padding:18px}@media(max-width:600px){section{padding:15px}.inline{width:120px!important}input[type=text]{width:100%}}\n</style><script>\n/* Flexible answer matching: ignore case/punctuation, accept common contractions and number words. */\nfunction celesteNorm(value){\n let s=String(value??'').toLowerCase().replace(/[’‘]/g,\"'\").trim();\n const contractions=[[/\\bcan't\\b/g,'cannot'],[/\\bcannot\\b/g,'cannot'],[/\\bwon't\\b/g,'will not'],[/\\bdon't\\b/g,'do not'],[/\\bdoesn't\\b/g,'does not'],[/\\bdidn't\\b/g,'did not'],[/\\bisn't\\b/g,'is not'],[/\\baren't\\b/g,'are not'],[/\\bwasn't\\b/g,'was not'],[/\\bweren't\\b/g,'were not'],[/\\bhaven't\\b/g,'have not'],[/\\bhasn't\\b/g,'has not'],[/\\bhadn't\\b/g,'had not'],[/\\bwouldn't\\b/g,'would not'],[/\\bshouldn't\\b/g,'should not'],[/\\bcouldn't\\b/g,'could not'],[/\\bit's\\b/g,'it is'],[/\\bthey're\\b/g,'they are'],[/\\bwe're\\b/g,'we are'],[/\\byou're\\b/g,'you are'],[/\\bI'm\\b/gi,'i am'],[/\\bhe's\\b/g,'he is'],[/\\bshe's\\b/g,'she is'],[/\\bthat's\\b/g,'that is'],[/\\bthere's\\b/g,'there is'],[/\\bwhat's\\b/g,'what is'],[/\\bwho's\\b/g,'who is'],[/\\bwhere's\\b/g,'where is'],[/\\bhow's\\b/g,'how is'],[/\\bthey've\\b/g,'they have'],[/\\bwe've\\b/g,'we have'],[/\\byou've\\b/g,'you have'],[/\\bI've\\b/g,'i have'],[/\\bI'll\\b/g,'i will'],[/\\byou'll\\b/g,'you will'],[/\\bwe'll\\b/g,'we will'],[/\\bthey'll\\b/g,'they will'],[/\\bhe'll\\b/g,'he will'],[/\\bshe'll\\b/g,'she will']];\n for(const [pattern,replacement] of contractions)s=s.replace(pattern,replacement);\n const nums={zero:'0',oh:'0',one:'1',two:'2',three:'3',four:'4',five:'5',six:'6',seven:'7',eight:'8',nine:'9',ten:'10',eleven:'11',twelve:'12',thirteen:'13',fourteen:'14',fifteen:'15',sixteen:'16',seventeen:'17',eighteen:'18',nineteen:'19',twenty:'20',thirty:'30',forty:'40',fifty:'50',sixty:'60',seventy:'70',eighty:'80',ninety:'90'};\n s=s.replace(/\\b(zero|oh|one|two|three|four|five|six|seven|eight|nine|ten|eleven|twelve|thirteen|fourteen|fifteen|sixteen|seventeen|eighteen|nineteen|twenty|thirty|forty|fifty|sixty|seventy|eighty|ninety)\\b/g,w=>nums[w]);\n return s.replace(/[^a-z0-9\\s']/g,' ').replace(/\\s+/g,' ').trim();\n}\n<\/script>\n</head>\n<body>\n<div class=\"combined-nav\"><a href=\"../index.html\">← All units</a></div>\n<header><div class=\"wrap\"><h1>CELESTE English School</h1><p>Units 11–12 Quiz · Interactive exam</p></div></header>\n<main class=\"wrap\">\n<div class=\"instructions\"><strong>Instructions</strong><br>Complete all six sections. Section A listening audio can be played a maximum of <strong>two times</strong>. Section E uses medication names instead of the original printed pictures because the image-to-letter mapping was not supplied. Submit to see your score and answer feedback.</div>\n<form id=\"exam\">\n<section><h2>A. Listening</h2><p class=\"sub\">Listen to the conversation. Check the correct answers.</p>\n<label class=\"small\" for=\"audioFile\">Upload the listening audio file:</label><br><input id=\"audioFile\" type=\"file\" accept=\"audio/*\"><audio id=\"audio\" controls controlsList=\"nodownload noplaybackrate\" style=\"display:none;width:100%;margin-top:12px\"></audio><p id=\"playCount\" class=\"small\">Audio has not been uploaded. Once uploaded, it can be played twice.</p>\n<div class=\"q\"><strong>1. Mark is going to be ___.</strong><label class=\"choice\"><input type=\"radio\" name=\"a1\" value=\"13 years old\"> 13 years old</label><label class=\"choice\"><input type=\"radio\" name=\"a1\" value=\"30 years old\"> 30 years old</label><label class=\"choice\"><input type=\"radio\" name=\"a1\" value=\"33 years old\"> 33 years old</label></div>\n<div class=\"q\"><strong>2. They're going to have a party on ___.</strong><label class=\"choice\"><input type=\"radio\" name=\"a2\" value=\"Friday\"> Friday</label><label class=\"choice\"><input type=\"radio\" name=\"a2\" value=\"Saturday\"> Saturday</label><label class=\"choice\"><input type=\"radio\" name=\"a2\" value=\"Sunday\"> Sunday</label></div>\n<div class=\"q\"><strong>3. They're going to ___ at the party.</strong><label class=\"choice\"><input type=\"radio\" name=\"a3\" value=\"dance\"> dance</label><label class=\"choice\"><input type=\"radio\" name=\"a3\" value=\"sing songs\"> sing songs</label><label class=\"choice\"><input type=\"radio\" name=\"a3\" value=\"watch television\"> watch television</label></div>\n</section>\n<section><h2>B. Match the Questions with the Answers</h2><p class=\"sub\">Choose the matching letter for each question.</p>\n<div class=\"q\">1. Are we going to work this weekend? <select name=\"b1\"><option value=\"\">Choose...</option><option value=\"a\">a</option><option value=\"b\">b</option><option value=\"c\">c</option><option value=\"d\">d</option><option value=\"e\">e</option><option value=\"f\">f</option></select></div>\n<div class=\"q\">2. Are they going to cook dinner? <select name=\"b2\"><option value=\"\">Choose...</option><option>a</option><option>b</option><option>c</option><option>d</option><option>e</option><option>f</option></select></div>\n<div class=\"q\">3. Are you going to exercise this evening? <select name=\"b3\"><option value=\"\">Choose...</option><option>a</option><option>b</option><option>c</option><option>d</option><option>e</option><option>f</option></select></div>\n<div class=\"q\">4. Is Bill going to do anything after work? <select name=\"b4\"><option value=\"\">Choose...</option><option>a</option><option>b</option><option>c</option><option>d</option><option>e</option><option>f</option></select></div>\n<div class=\"q\">5. Are Pam and Andrew going to have a picnic this weekend? <select name=\"b5\"><option value=\"\">Choose...</option><option>a</option><option>b</option><option>c</option><option>d</option><option>e</option><option>f</option></select></div>\n<div class=\"q\">6. Is it going to rain tomorrow? <select name=\"b6\"><option value=\"\">Choose...</option><option>a</option><option>b</option><option>c</option><option>d</option><option>e</option><option>f</option></select></div>\n<article><strong>Answers</strong><br>a. Yes, I am. I'm going to go swimming.<br>b. No, it's not. It's going to be cloudy.<br>c. No, we're not. We're going to relax.<br>d. Yes, they are. They're going to make pasta.<br>e. Yes, he is. He's going to visit his parents.<br>f. No, they're not. They're going to have a party.</article>\n</section>\n<section><h2>C. Write Wh-Questions</h2><p class=\"sub\">Write questions to complete the conversation.</p>\n<div class=\"q\"><strong>A:</strong> <input type=\"text\" name=\"c1\" placeholder=\"Question 1\"><br><strong>B:</strong> Next summer? We're going to go to Alaska.</div>\n<div class=\"q\"><strong>A:</strong> Alaska, wow! <input type=\"text\" name=\"c2\" placeholder=\"Question 2\"><br><strong>B:</strong> We're going to take a boat.</div>\n<div class=\"q\"><strong>A:</strong> That sounds so exciting! <input type=\"text\" name=\"c3\" placeholder=\"Question 3\"><br><strong>B:</strong> I'm going to go with my family.</div>\n<div class=\"q\"><strong>A:</strong> Great! <input type=\"text\" name=\"c4\" placeholder=\"Question 4\"><br><strong>B:</strong> We're going to go on June 21st.</div>\n</section>\n<section><h2>D. Circle the Correct Words</h2>\n<div class=\"q\">1. A: I <select name=\"d1a\"><option value=\"\">Choose...</option><option>feel</option><option>get</option><option>have</option></select> a headache.<br>B: <select name=\"d1b\"><option value=\"\">Choose...</option><option>Drink</option><option>Eat</option><option>Take</option></select> these pills.</div>\n<div class=\"q\">2. A: <select name=\"d2a\"><option value=\"\">Choose...</option><option>What's</option><option>How's</option><option>Why's</option></select> the matter?<br>B: I don't feel <select name=\"d2b\"><option value=\"\">Choose...</option><option>better</option><option>sick</option><option>well</option></select>. I have a stomachache.</div>\n<div class=\"q\">3. A: <select name=\"d3a\"><option value=\"\">Choose...</option><option>How</option><option>What</option><option>Where</option></select> do you feel today?<br>B: Not so good. I <select name=\"d3b\"><option value=\"\">Choose...</option><option>have</option><option>feel</option><option>am</option></select> sore eyes.</div>\n<div class=\"q\">4. A: I have a backache.<br>B: Don't <select name=\"d4a\"><option value=\"\">Choose...</option><option>exercise</option><option>rest</option><option>relax</option></select>. And <select name=\"d4b\"><option value=\"\">Choose...</option><option>put</option><option>use</option><option>give</option></select> this medication.</div>\n</section>\n<section><h2>E. Match the Medications with the Conversations</h2><p class=\"sub\">Choose the health problem that matches each medication. The original image letter mapping was not included in the supplied answer key, so this section is graded by medication and health problem rather than printed letters.</p>\n<div class=\"meds\"><div class=\"med\">MUSCLE CREAM<span>Medication 1</span></div><div class=\"med\">ASPIRIN TABLETS<span>Medication 2</span></div><div class=\"med\">ANTACID TABLETS<span>Medication 3</span></div><div class=\"med\">EYE DROPS<span>Medication 4</span></div></div>\n<div class=\"q\">1. Muscle cream is for a <select name=\"e1\"><option value=\"\">Choose...</option><option>backache</option><option>headache</option><option>stomachache</option><option>sore eyes</option></select>.</div>\n<div class=\"q\">2. Aspirin tablets are for a <select name=\"e2\"><option value=\"\">Choose...</option><option>backache</option><option>headache</option><option>stomachache</option><option>sore eyes</option></select>.</div>\n<div class=\"q\">3. Antacid tablets are for a <select name=\"e3\"><option value=\"\">Choose...</option><option>backache</option><option>headache</option><option>stomachache</option><option>sore eyes</option></select>.</div>\n<div class=\"q\">4. Eye drops are for <select name=\"e4\"><option value=\"\">Choose...</option><option>a backache</option><option>a headache</option><option>a stomachache</option><option>sore eyes</option></select>.</div>\n</section>\n<section><h2>F. Correct the Errors</h2><p class=\"sub\">Read the article, then rewrite each sentence correctly using information from the article.</p>\n<article><h3>Home Remedies</h3><p><strong>A Cold:</strong> Many people eat hot chicken soup. Other people drink water with red pepper, sugar, lemon juice, and milk.</p><p><strong>A Headache:</strong> Put a cold cloth on your head, or splash your face with cold water. You can also put your hands in hot water. This can help.</p><p><strong>A Cough:</strong> Drink warm tea or take some honey. This can make your throat feel better.</p><p><strong>Insomnia:</strong> Drink a large glass of warm milk. Or take a very warm bath.</p></article>\n<div class=\"q\"><strong>Example:</strong> Use these easy remedies at work.<br>Corrected: Use these easy remedies at home.</div>\n<div class=\"q\">1. For a cold, some people eat hot pepper soup or drink hot water.<br><input type=\"text\" name=\"f1\" placeholder=\"Corrected sentence\"></div>\n<div class=\"q\">2. For a cough, you can drink warm milk or take some honey.<br><input type=\"text\" name=\"f2\" placeholder=\"Corrected sentence\"></div>\n<div class=\"q\">3. For a headache, put a little hot water on your face.<br><input type=\"text\" name=\"f3\" placeholder=\"Corrected sentence\"></div>\n<div class=\"q\">4. For insomnia, drink warm tea or take a warm bath.<br><input type=\"text\" name=\"f4\" placeholder=\"Corrected sentence\"></div>\n</section>\n<div class=\"actions\"><button class=\"btn primary\" type=\"submit\">Submit Exam &amp; Grade</button><button class=\"btn secondary\" type=\"button\" id=\"resetBtn\">Reset Answers</button></div>\n</form>\n<div id=\"results\" aria-live=\"polite\"><h2>Exam Results</h2><div id=\"score\"></div><p id=\"summary\"></p><div id=\"feedback\"></div><button class=\"btn primary\" type=\"button\" id=\"downloadBtn\">Download My Results (.txt)</button></div>\n</main><footer>CELESTE English School · Units 11–12 Quiz</footer>\n<script>\nconst audioInput=document.getElementById('audioFile'),audio=document.getElementById('audio'),playCount=document.getElementById('playCount');let plays=0,audioUrl=null,playingAllowed=false;\naudioInput.addEventListener('change',()=>{const file=audioInput.files[0];if(!file)return;if(audioUrl)URL.revokeObjectURL(audioUrl);audioUrl=URL.createObjectURL(file);audio.src=audioUrl;audio.style.display='block';plays=0;playingAllowed=true;audio.controls=true;playCount.textContent='Plays used: 0 / 2';audio.load();});\naudio.addEventListener('play',()=>{if(!playingAllowed||plays>=2){audio.pause();return;}plays++;playCount.textContent='Plays used: '+plays+' / 2';});\naudio.addEventListener('ended',()=>{if(plays>=2){playingAllowed=false;audio.controls=false;playCount.textContent='Maximum two plays reached.';}});\naudio.addEventListener('seeking',()=>{if(audio.currentTime>0)audio.currentTime=0;});\nconst key={a1:'13 years old',a2:'Saturday',a3:'sing songs',b1:'c',b2:'d',b3:'a',b4:'e',b5:'f',b6:'b',\nc1:'Where are you going next summer?',c2:'How are you going to get there?',c3:'Who are you going to go with?',c4:'When are you going to go?',\nd1a:'have',d1b:'Take',d2a:\"What's\",d2b:'well',d3a:'How',d3b:'have',d4a:'exercise',d4b:'use',\ne1:'backache',e2:'headache',e3:'stomachache',e4:'sore eyes',\nf1:'For a cold, some people eat hot chicken soup or drink water with red pepper, sugar, lemon juice, and milk.',\nf2:'For a cough, you can drink warm tea or take some honey.',\nf3:'For a headache, put a cold cloth on your head or splash your face with cold water.',\nf4:'For insomnia, drink warm milk or take a warm bath.'};\nconst normalize=s=>celesteNorm(s);\nconst keys=Object.keys(key);let latestReport='';\nfunction esc(s){return String(s).replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]));}\ndocument.getElementById('exam').addEventListener('submit',ev=>{ev.preventDefault();let earned=0,total=keys.length,items=[];\nkeys.forEach(k=>{const el=document.querySelector('[name=\"'+k+'\"]'),val=el?.value||'';let ok=normalize(val)===normalize(key[k]);\nif(k==='c1')ok=/^where are you going next summer$/.test(normalize(val));\nif(k==='c2')ok=/^how are you going to get there$/.test(normalize(val));\nif(k==='c3')ok=/^who are you going to go with$/.test(normalize(val));\nif(k==='c4')ok=/^when are you going to go$/.test(normalize(val));\nif(k[0]==='f'){const v=normalize(val),a=normalize(key[k]);ok=v===a || (k==='f3'&&v==='for a headache put a cold cloth on your head or splash your face with cold water') || (k==='f4'&&v==='for insomnia drink warm milk or take a warm bath');}\nif(ok)earned++;items.push({label:k.toUpperCase(),val:val||'(blank)',ans:key[k],ok});});\nconst pct=Math.round(earned/total*100);document.getElementById('score').textContent=`${earned} / ${total} (${pct}%)`;document.getElementById('summary').textContent='Each item is worth one point. For Section F, include the key corrected information; punctuation differences are ignored.';\nconst box=document.getElementById('feedback');box.innerHTML='';items.forEach(r=>{const d=document.createElement('div');d.className='feedback';d.innerHTML=`<strong>${r.label}</strong>: ${esc(r.val)} — <span class=\"${r.ok?'correct':'incorrect'}\">${r.ok?'Correct':'Incorrect'}</span><br><span class=\"small\">Answer: ${esc(r.ans)}</span>`;box.appendChild(d);});\nlatestReport=`CELESTE English School — Units 11–12 Quiz\\nScore: ${earned}/${total} (${pct}%)\\n\\n`+items.map(r=>`${r.label}: ${r.val} | ${r.ok?'Correct':'Incorrect'} | Correct answer: ${r.ans}`).join('\\n')+'\\n';\ndocument.getElementById('results').style.display='block';document.getElementById('results').scrollIntoView({behavior:'smooth'});});\ndocument.getElementById('downloadBtn').addEventListener('click',()=>{const url=URL.createObjectURL(new Blob([latestReport],{type:'text/plain;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download='units-11-12-quiz-results.txt';a.click();URL.revokeObjectURL(url);});\ndocument.getElementById('resetBtn').addEventListener('click',()=>{if(confirm('Reset all answers and start again?')){document.getElementById('exam').reset();document.getElementById('results').style.display='none';plays=0;playingAllowed=false;audio.pause();audio.removeAttribute('src');audio.style.display='none';audio.controls=true;playCount.textContent='Audio has not been uploaded. Once uploaded, it can be played twice.';latestReport='';}});\n<\/script><style>.combined-nav{padding:9px 16px;background:#fff;border-bottom:1px solid #ddd;font:700 14px system-ui}.combined-nav a{color:#8e302d;text-decoration:none}.celeste-print-result{display:flex;align-items:center;justify-content:center;width:max-content;max-width:100%;margin:18px auto;padding:12px 18px;border:0;border-radius:9px;background:#8e302d;color:#fff;font-weight:800;cursor:pointer}@media print{.combined-nav,.celeste-print-result,button[type=submit],input[type=file],audio{display:none!important}body{background:#fff!important}}</style><script>document.addEventListener('DOMContentLoaded',function(){var a=document.querySelector('audio');if(a&&!a.getAttribute('src')){a.src='audio/U11-12_A1.mp3';a.load();}var b=document.createElement('button');b.type='button';b.className='celeste-print-result';b.textContent='Print as PDF';b.hidden=true;b.onclick=function(){window.print()};document.body.appendChild(b);var f=document.querySelector('form');if(f)f.addEventListener('submit',function(){setTimeout(function(){b.hidden=false},200)});});<\/script>\n<script>\ndocument.addEventListener('DOMContentLoaded', function() {\n  const audioPath = 'audio/U11-12_A1.mp3';\n  const audio = document.getElementById('listeningAudio') || document.getElementById('audio');\n  if (audio) {\n    audio.src = audioPath;\n    audio.load();\n    audio.style.display = 'block';\n    audio.controls = !document.getElementById('playAudio');\n    const playBtn = document.getElementById('playAudio');\n    const status = document.getElementById('audioStatus') || document.getElementById('playCount');\n    if (playBtn) { playBtn.disabled = false; playBtn.textContent = '▶ Play audio (2 plays left)'; }\n    if (status) status.textContent = 'Audio path: audio/U11-12_A1.mp3';\n  }\n});\n<\/script>\n<style>\n/* CELESTE submitted-result panel */\n#result,#results{box-sizing:border-box;max-width:1000px;margin:28px auto;padding:clamp(20px,4vw,36px);background:#fff;border:1px solid #e6e8ee;border-radius:18px;box-shadow:0 12px 36px rgba(25,35,55,.09);color:#202638}\n#result h2,#results h2{margin:0 0 12px;color:#8e302d;font-size:clamp(1.5rem,3vw,2rem);font-weight:800;letter-spacing:-.02em}\n#scoreHeading,#score{display:block;margin:12px 0 20px;font-size:1.2rem;font-weight:800;color:#202638}\n#resultGrid,#feedback{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:12px}\n#resultGrid .result-item,#feedback .feedback{box-sizing:border-box;padding:15px;border:1px solid #f0b7b7;border-left:5px solid #c94a4a;border-radius:12px;background:#fff8f8;line-height:1.55;overflow-wrap:anywhere}\n#resultGrid .result-item strong,#feedback .feedback strong{display:block;margin-bottom:5px;color:#9f2f2f}\n.celeste-print-result{display:flex;align-items:center;justify-content:center;gap:8px;width:max-content;max-width:100%;margin:22px auto 0;padding:13px 22px;border:0;border-radius:10px;background:#8e302d;color:#fff;font-size:1rem;font-weight:800;cursor:pointer;box-shadow:0 4px 12px rgba(142,48,45,.2)}\n.celeste-print-result:hover{background:#702421}\n@media(max-width:600px){#result,#results{margin:16px 8px;padding:18px;border-radius:14px}#resultGrid,#feedback{grid-template-columns:1fr}.celeste-print-result{width:max-content;max-width:100%;margin-left:auto;margin-right:auto}}\n@media print{body{background:#fff!important}#result,#results{max-width:none;margin:0;padding:0;border:0;border-radius:0;box-shadow:none}#resultGrid,#feedback{display:block}#resultGrid .result-item,#feedback .feedback{break-inside:avoid;margin:0 0 10px}.combined-nav,.celeste-print-result,button,input[type=file],audio,footer{display:none!important}}\n</style>\n<script>\n(function(){\n function setupResultView(){\n  const result=document.getElementById('result')||document.getElementById('results');\n  if(!result)return;\n  const heading=result.querySelector('h2');if(heading && heading.textContent!=='Exam submitted')heading.textContent='Exam submitted';\n  function cleanAndStyle(){\n   // Keep only incorrect / unanswered items; never reveal the answer key.\n   const grid=document.getElementById('resultGrid');\n   if(grid){[...grid.children].forEach(card=>{\n    const label=card.querySelector('strong');\n    if(label && /·\\s*Correct\\s*$/.test(label.textContent) && !/Incorrect/.test(label.textContent)){card.remove();return;}\n    [...card.querySelectorAll('*')].forEach(el=>{if(el.children.length===0 && /^\\s*Correct answer\\s*:/i.test(el.textContent||''))el.remove();});\n    card.querySelectorAll('.small').forEach(el=>el.remove());\n   });}\n   const feedback=document.getElementById('feedback');\n   if(feedback){[...feedback.children].forEach(card=>{\n    if(card.querySelector('.correct')){card.remove();return;}\n    card.querySelectorAll('.small').forEach(el=>el.remove());\n    [...card.querySelectorAll('*')].forEach(el=>{if(el.children.length===0 && /^\\s*Correct answer\\s*:/i.test(el.textContent||''))el.remove();});\n    card.innerHTML=card.innerHTML.replace(/<br\\s*\\/?><span[^>]*>\\s*Correct answer:[\\s\\S]*?<\\/span>/gi,'');\n   });}\n   // Remove text-response downloads and secondary result actions.\n   result.querySelectorAll('#downloadBtn,button[id=\"editBtn\"]').forEach(el=>el.remove());\n   // Some older pages put result actions in a shared action row.\n   result.querySelectorAll('.bottom-actions').forEach(row=>{if(!row.querySelector('button:not(.celeste-print-result)'))row.remove();});\n   // Keep exactly one PDF button in the submitted-result panel.\n   document.querySelectorAll('body > .celeste-print-result').forEach(el=>el.remove());\n   let printBtn=result.querySelector('.celeste-print-result');\n   if(!printBtn){printBtn=document.createElement('button');printBtn.type='button';printBtn.className='celeste-print-result';printBtn.textContent='Print as PDF';printBtn.addEventListener('click',()=>window.print());result.appendChild(printBtn);}\n   else {if(printBtn.textContent!=='Print as PDF')printBtn.textContent='Print as PDF';printBtn.hidden=false;}\n  }\n  // Wait until the original grading script has rendered its result.\n  const form=document.querySelector('form');if(form)form.addEventListener('submit',()=>setTimeout(cleanAndStyle,80));\n  const observer=new MutationObserver(()=>{if(result.style.display!=='none' && result.offsetHeight)cleanAndStyle();});\n  observer.observe(result,{childList:true,subtree:true});\n  if(result.style.display!=='none' && result.offsetHeight)cleanAndStyle();\n }\n if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',setupResultView);else setupResultView();\n})();\n<\/script>\n<script>\n(function(){\n  window.print=function(){try{parent.postMessage({type:'celeste-print-request'},'*')}catch(e){}};\n  function h(){try{parent.postMessage({type:'celeste-height',height:document.documentElement.scrollHeight},'*')}catch(e){}}\n  addEventListener('load',h);setTimeout(h,250);setTimeout(h,1000);\n  if('ResizeObserver'in window)new ResizeObserver(h).observe(document.documentElement);\n})();\n<\/script></body></html>", "<!DOCTYPE html>\n<html lang=\"en\"><head><meta charset=\"UTF-8\"><meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>CELESTE English School — Units 13–14 Quiz</title>\n<style>\n:root{--navy:#172554;--blue:#2563eb;--ink:#1f2937;--muted:#64748b;--line:#dbe3ef;--green:#15803d;--red:#b91c1c}\n*{box-sizing:border-box}body{margin:0;background:#f3f6fb;color:var(--ink);font:16px/1.55 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}\nheader{background:linear-gradient(135deg,#172554,#1d4ed8);color:white;padding:28px 18px}.wrap{max-width:980px;margin:auto;padding:0 16px}header h1{margin:0;font-size:clamp(1.5rem,4vw,2.25rem)}header p{margin:5px 0 0;color:#dbeafe}\nmain{padding:22px 0 50px}.instructions,section,#results{background:white;border:1px solid var(--line);border-radius:14px;padding:18px;margin:16px 0;box-shadow:0 3px 12px #0f172a08}\nh2{font-size:1.15rem;margin:0 0 12px;color:var(--navy)}.sub,.small{color:var(--muted);font-size:.92rem}.sub{margin-top:-6px}.q{padding:11px 0;border-top:1px solid #edf1f7}.q:first-of-type{border-top:0}\ninput[type=text],select{font:inherit;border:1px solid #cbd5e1;border-radius:8px;padding:7px 10px;background:white;max-width:100%}input[type=text]{width:min(100%,480px)}.inline{width:155px!important;display:inline-block;margin:3px 2px}\n.choice{display:flex;gap:9px;align-items:flex-start;margin:7px 0}.choice input{margin-top:6px}\n.actions{display:flex;flex-wrap:wrap;gap:10px;margin:20px 0}.btn{border:0;border-radius:10px;padding:11px 17px;font:inherit;font-weight:650;cursor:pointer}.primary{background:var(--blue);color:white}.secondary{background:#e2e8f0;color:#0f172a}\n#results{display:none;border:2px solid var(--blue)}#score{font-size:1.5rem;font-weight:800;color:var(--navy)}.feedback{margin:10px 0;padding:10px 12px;border-radius:8px;background:#f8fafc}.correct{color:var(--green);font-weight:700}.incorrect{color:var(--red);font-weight:700}\narticle{border-left:4px solid #93c5fd;padding:12px 16px;background:#f8fbff;border-radius:0 10px 10px 0}.mapnote{padding:10px;background:#f8fafc;border-radius:8px;color:#475569}\nfooter{text-align:center;color:var(--muted);padding:18px}@media(max-width:600px){section{padding:15px}.inline{width:120px!important}input[type=text]{width:100%}}\n</style><script>\n/* Flexible answer matching: ignore case/punctuation, accept common contractions and number words. */\nfunction celesteNorm(value){\n let s=String(value??'').toLowerCase().replace(/[’‘]/g,\"'\").trim();\n const contractions=[[/\\bcan't\\b/g,'cannot'],[/\\bcannot\\b/g,'cannot'],[/\\bwon't\\b/g,'will not'],[/\\bdon't\\b/g,'do not'],[/\\bdoesn't\\b/g,'does not'],[/\\bdidn't\\b/g,'did not'],[/\\bisn't\\b/g,'is not'],[/\\baren't\\b/g,'are not'],[/\\bwasn't\\b/g,'was not'],[/\\bweren't\\b/g,'were not'],[/\\bhaven't\\b/g,'have not'],[/\\bhasn't\\b/g,'has not'],[/\\bhadn't\\b/g,'had not'],[/\\bwouldn't\\b/g,'would not'],[/\\bshouldn't\\b/g,'should not'],[/\\bcouldn't\\b/g,'could not'],[/\\bit's\\b/g,'it is'],[/\\bthey're\\b/g,'they are'],[/\\bwe're\\b/g,'we are'],[/\\byou're\\b/g,'you are'],[/\\bI'm\\b/gi,'i am'],[/\\bhe's\\b/g,'he is'],[/\\bshe's\\b/g,'she is'],[/\\bthat's\\b/g,'that is'],[/\\bthere's\\b/g,'there is'],[/\\bwhat's\\b/g,'what is'],[/\\bwho's\\b/g,'who is'],[/\\bwhere's\\b/g,'where is'],[/\\bhow's\\b/g,'how is'],[/\\bthey've\\b/g,'they have'],[/\\bwe've\\b/g,'we have'],[/\\byou've\\b/g,'you have'],[/\\bI've\\b/g,'i have'],[/\\bI'll\\b/g,'i will'],[/\\byou'll\\b/g,'you will'],[/\\bwe'll\\b/g,'we will'],[/\\bthey'll\\b/g,'they will'],[/\\bhe'll\\b/g,'he will'],[/\\bshe'll\\b/g,'she will']];\n for(const [pattern,replacement] of contractions)s=s.replace(pattern,replacement);\n const nums={zero:'0',oh:'0',one:'1',two:'2',three:'3',four:'4',five:'5',six:'6',seven:'7',eight:'8',nine:'9',ten:'10',eleven:'11',twelve:'12',thirteen:'13',fourteen:'14',fifteen:'15',sixteen:'16',seventeen:'17',eighteen:'18',nineteen:'19',twenty:'20',thirty:'30',forty:'40',fifty:'50',sixty:'60',seventy:'70',eighty:'80',ninety:'90'};\n s=s.replace(/\\b(zero|oh|one|two|three|four|five|six|seven|eight|nine|ten|eleven|twelve|thirteen|fourteen|fifteen|sixteen|seventeen|eighteen|nineteen|twenty|thirty|forty|fifty|sixty|seventy|eighty|ninety)\\b/g,w=>nums[w]);\n return s.replace(/[^a-z0-9\\s']/g,' ').replace(/\\s+/g,' ').trim();\n}\n<\/script>\n</head><body>\n<div class=\"combined-nav\"><a href=\"../index.html\">← All units</a></div>\n<header><div class=\"wrap\"><h1>CELESTE English School</h1><p>Units 13–14 Quiz · Interactive exam</p></div></header>\n<main class=\"wrap\">\n<div class=\"instructions\"><strong>Instructions</strong><br>Complete all six sections. Section A listening audio can be played a maximum of <strong>two times</strong>. Section B uses the location image from your textbook; upload it to view it while answering. Submit to see your score and correct answers.</div>\n<form id=\"exam\">\n<section><h2>A. Listening — Helen and Mark</h2><p class=\"sub\">Listen to the conversations. Check the correct answers.</p>\n<label class=\"small\" for=\"audioFile\">Upload the listening audio file:</label><br><input id=\"audioFile\" type=\"file\" accept=\"audio/*\"><audio id=\"audio\" controls controlsList=\"nodownload noplaybackrate\" style=\"display:none;width:100%;margin-top:12px\"></audio><p id=\"playCount\" class=\"small\">Audio has not been uploaded. Once uploaded, it can be played twice.</p>\n<div class=\"q\"><strong>1. Where are Helen and Mark going?</strong><label class=\"choice\"><input type=\"radio\" name=\"a1\" value=\"A bank and a department store.\"> A bank and a department store.</label><label class=\"choice\"><input type=\"radio\" name=\"a1\" value=\"A bank and a gas station.\"> A bank and a gas station.</label><label class=\"choice\"><input type=\"radio\" name=\"a1\" value=\"A gas station and a department store.\"> A gas station and a department store.</label></div>\n<div class=\"q\"><strong>2. Where is Smith's Department Store?</strong><label class=\"choice\"><input type=\"radio\" name=\"a2\" value=\"On Second Street.\"> On Second Street.</label><label class=\"choice\"><input type=\"radio\" name=\"a2\" value=\"On the corner of First and Main.\"> On the corner of First and Main.</label><label class=\"choice\"><input type=\"radio\" name=\"a2\" value=\"On Main, between First and Second.\"> On Main, between First and Second.</label></div>\n<div class=\"q\"><strong>3. How do you get there?</strong><label class=\"choice\"><input type=\"radio\" name=\"a3\" value=\"Walk up Second to Main. Turn left.\"> Walk up Second to Main. Turn left.</label><label class=\"choice\"><input type=\"radio\" name=\"a3\" value=\"Walk down Second to Main. Turn right.\"> Walk down Second to Main. Turn right.</label><label class=\"choice\"><input type=\"radio\" name=\"a3\" value=\"Walk up Second to Main. Turn right.\"> Walk up Second to Main. Turn right.</label></div>\n<div class=\"q\"><strong>4. What is Mark going to buy?</strong><label class=\"choice\"><input type=\"radio\" name=\"a4\" value=\"A sweatshirt.\"> A sweatshirt.</label><label class=\"choice\"><input type=\"radio\" name=\"a4\" value=\"A tie.\"> A tie.</label><label class=\"choice\"><input type=\"radio\" name=\"a4\" value=\"A sweater.\"> A sweater.</label></div>\n</section>\n<section><h2>B. Prepositions and Places</h2><p class=\"sub\">Upload the textbook image showing the streets and buildings, then complete the sentences using the prepositions in the box.</p>\n<label class=\"small\" for=\"mapImage\">Upload the image for Section B:</label><br><input type=\"file\" id=\"mapImage\" accept=\"image/*\"><div id=\"imagePreview\" style=\"margin-top:10px\"></div>\n<p class=\"mapnote\"><strong>Word box:</strong> across from · between · next to · on · on the corner of</p>\n<div class=\"q\">1. The department store is <input class=\"inline\" type=\"text\" name=\"b1a\"> Main Street.<br>It's <input class=\"inline\" type=\"text\" name=\"b1b\"> Green and Park.</div>\n<div class=\"q\">2. The department store is <input class=\"inline\" type=\"text\" name=\"b2\"> the bank.</div>\n<div class=\"q\">3. The restaurant is <input class=\"inline\" type=\"text\" name=\"b3\"> the department store.</div>\n<div class=\"q\">4. The restaurant is <input class=\"inline\" type=\"text\" name=\"b4\"> Main Street and Green Avenue.</div>\n</section>\n<section><h2>C. Giving Directions</h2><p class=\"sub\">Imagine you are at the drugstore in Part B. Circle the correct words.</p>\n<p><strong>TOURIST:</strong> Excuse me. How do I get to the bank?</p>\n<p><strong>YOU:</strong> Just walk down Park Avenue <select name=\"c1\"><option value=\"\">Choose...</option><option>to</option><option>on</option></select> Main Street.</p>\n<p>Then turn <select name=\"c2\"><option value=\"\">Choose...</option><option>left</option><option>right</option></select>. The bank is on the <select name=\"c3\"><option value=\"\">Choose...</option><option>left</option><option>right</option></select>.</p>\n</section>\n<section><h2>D. Match Verbs with Words or Phrases</h2>\n<div class=\"q\">1. had <select name=\"d1\"><option value=\"\">Choose...</option><option>a. photos</option><option>b. a picnic</option><option>c. tennis</option><option>d. a play</option><option>e. swimming</option></select></div>\n<div class=\"q\">2. played <select name=\"d2\"><option value=\"\">Choose...</option><option>a. photos</option><option>b. a picnic</option><option>c. tennis</option><option>d. a play</option><option>e. swimming</option></select></div>\n<div class=\"q\">3. took <select name=\"d3\"><option value=\"\">Choose...</option><option>a. photos</option><option>b. a picnic</option><option>c. tennis</option><option>d. a play</option><option>e. swimming</option></select></div>\n<div class=\"q\">4. went <select name=\"d4\"><option value=\"\">Choose...</option><option>a. photos</option><option>b. a picnic</option><option>c. tennis</option><option>d. a play</option><option>e. swimming</option></select></div>\n<div class=\"q\">5. saw <select name=\"d5\"><option value=\"\">Choose...</option><option>a. photos</option><option>b. a picnic</option><option>c. tennis</option><option>d. a play</option><option>e. swimming</option></select></div>\n</section>\n<section><h2>E. Simple Past</h2><p class=\"sub\">Complete the conversations using the simple past form of the verbs in parentheses.</p>\n<div class=\"q\">1. A: <input class=\"inline\" type=\"text\" name=\"e1a\"> (have) a good weekend?<br>B: Not really. I <input class=\"inline\" type=\"text\" name=\"e1b\"> (study) all weekend.</div>\n<div class=\"q\">2. A: <input class=\"inline\" type=\"text\" name=\"e2a\"> (do) anything last weekend?<br>B: Yes, they <input class=\"inline\" type=\"text\" name=\"e2b\"> (go) hiking in the woods.</div>\n<div class=\"q\">3. A: <input class=\"inline\" type=\"text\" name=\"e3a\"> (get) anything at the mall?<br>B: No. She went shopping, but she <input class=\"inline\" type=\"text\" name=\"e3b\"> (not buy) anything.</div>\n</section>\n<section><h2>F. Reading Comprehension — Home Alone</h2><p class=\"sub\">Read the article. Then complete the sentences.</p>\n<article><h3>Home Alone</h3>\n<p>Jerry Carson, 16, had a terrible weekend. His parents went to visit his aunt, but he stayed home. He got up early on Saturday and went downstairs to the basement to do laundry.</p>\n<p>He went back upstairs, but at the top of the stairs, the door was locked! He pushed on it, but it didn't open. He called to his neighbors, but they didn't hear him.</p>\n<p>Luckily, Jerry had food to eat. There were some extra groceries in the basement. And he had a place to sleep. He put some clothes from the laundry on the floor and slept on them.</p>\n<p>His parents came home Sunday morning and found Jerry in the basement. \"We called Jerry late Saturday night, but he didn't answer the phone,\" said his father. \"We came home right away. We're just happy he's all right.\"</p></article>\n<div class=\"q\">1. Jerry went to the basement to <input type=\"text\" name=\"f1\" placeholder=\"Complete the sentence\"></div>\n<div class=\"q\">2. Jerry slept on <input type=\"text\" name=\"f2\" placeholder=\"Complete the sentence\"></div>\n<div class=\"q\">3. Jerry's parents came home because Jerry <input type=\"text\" name=\"f3\" placeholder=\"Complete the sentence\"></div>\n</section>\n<div class=\"actions\"><button class=\"btn primary\" type=\"submit\">Submit Exam &amp; Grade</button><button class=\"btn secondary\" type=\"button\" id=\"resetBtn\">Reset Answers</button></div>\n</form>\n<div id=\"results\" aria-live=\"polite\"><h2>Exam Results</h2><div id=\"score\"></div><p id=\"summary\"></p><div id=\"feedback\"></div><button class=\"btn primary\" type=\"button\" id=\"downloadBtn\">Download My Results (.txt)</button></div>\n</main><footer>CELESTE English School · Units 13–14 Quiz</footer>\n<script>\nconst audioInput=document.getElementById('audioFile'),audio=document.getElementById('audio'),playCount=document.getElementById('playCount');let plays=0,audioUrl=null,playingAllowed=false;\naudioInput.addEventListener('change',()=>{const file=audioInput.files[0];if(!file)return;if(audioUrl)URL.revokeObjectURL(audioUrl);audioUrl=URL.createObjectURL(file);audio.src=audioUrl;audio.style.display='block';plays=0;playingAllowed=true;audio.controls=true;playCount.textContent='Plays used: 0 / 2';audio.load();});\naudio.addEventListener('play',()=>{if(!playingAllowed||plays>=2){audio.pause();return;}plays++;playCount.textContent='Plays used: '+plays+' / 2';});\naudio.addEventListener('ended',()=>{if(plays>=2){playingAllowed=false;audio.controls=false;playCount.textContent='Maximum two plays reached.';}});\naudio.addEventListener('seeking',()=>{if(audio.currentTime>0)audio.currentTime=0;});\ndocument.getElementById('mapImage').addEventListener('change',e=>{const f=e.target.files[0],box=document.getElementById('imagePreview');box.innerHTML='';if(f){const img=document.createElement('img');img.src=URL.createObjectURL(f);img.alt='Uploaded map image for Section B';img.style.cssText='max-width:100%;max-height:480px;border-radius:10px;border:1px solid #dbe3ef';box.appendChild(img);}});\nconst key={a1:'A bank and a department store.',a2:'On the corner of First and Main.',a3:'Walk up Second to Main. Turn right.',a4:'A sweater.',\nb1a:'on',b1b:'between',b2:'across from',b3:'next to',b4:'on the corner of',\nc1:'to',c2:'left',c3:'right',d1:'b. a picnic',d2:'c. tennis',d3:'a. photos',d4:'e. swimming',d5:'d. a play',\ne1a:'Did you have',e1b:'studied',e2a:'Did they do',e2b:'went',e3a:'Did she get',e3b:\"didn't buy\",\nf1:'do the laundry',f2:'some clothes from the laundry',f3:\"didn't answer the phone\"};\nconst normalize=s=>celesteNorm(s);\nconst keys=Object.keys(key);let latestReport='';\nfunction esc(s){return String(s).replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]));}\ndocument.getElementById('exam').addEventListener('submit',ev=>{ev.preventDefault();let earned=0,total=keys.length,items=[];\nkeys.forEach(k=>{const el=document.querySelector('[name=\"'+k+'\"]'),val=(el?.value||'').trim();let ok=normalize(val)===normalize(key[k]);\nif(k==='e1a')ok=/^did you have$/.test(normalize(val));\nif(k==='e2a')ok=/^did they do$/.test(normalize(val));\nif(k==='e3a')ok=/^did she get$/.test(normalize(val));\nif(k==='f1')ok=/do the laundry/.test(normalize(val));\nif(k==='f2')ok=/some clothes from the laundry/.test(normalize(val));\nif(k==='f3')ok=/didn't answer the phone/.test(normalize(val));\nif(ok)earned++;items.push({label:k.toUpperCase(),val:val||'(blank)',ans:key[k],ok});});\nconst pct=Math.round(earned/total*100);document.getElementById('score').textContent=`${earned} / ${total} (${pct}%)`;document.getElementById('summary').textContent='Each question or blank is worth one point. Minor punctuation differences are ignored.';\nconst box=document.getElementById('feedback');box.innerHTML='';items.forEach(r=>{const d=document.createElement('div');d.className='feedback';d.innerHTML=`<strong>${r.label}</strong>: ${esc(r.val)} — <span class=\"${r.ok?'correct':'incorrect'}\">${r.ok?'Correct':'Incorrect'}</span><br><span class=\"small\">Correct answer: ${esc(r.ans)}</span>`;box.appendChild(d);});\nlatestReport=`CELESTE English School — Units 13–14 Quiz\\nScore: ${earned}/${total} (${pct}%)\\n\\n`+items.map(r=>`${r.label}: ${r.val} | ${r.ok?'Correct':'Incorrect'} | Correct answer: ${r.ans}`).join('\\n')+'\\n';\ndocument.getElementById('results').style.display='block';document.getElementById('results').scrollIntoView({behavior:'smooth'});});\ndocument.getElementById('downloadBtn').addEventListener('click',()=>{const url=URL.createObjectURL(new Blob([latestReport],{type:'text/plain;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download='units-13-14-quiz-results.txt';a.click();URL.revokeObjectURL(url);});\ndocument.getElementById('resetBtn').addEventListener('click',()=>{if(confirm('Reset all answers and start again?')){document.getElementById('exam').reset();document.getElementById('results').style.display='none';document.getElementById('imagePreview').innerHTML='';plays=0;playingAllowed=false;audio.pause();audio.removeAttribute('src');audio.style.display='none';audio.controls=true;playCount.textContent='Audio has not been uploaded. Once uploaded, it can be played twice.';latestReport='';}});\n<\/script><style>.combined-nav{padding:9px 16px;background:#fff;border-bottom:1px solid #ddd;font:700 14p results');\n  if(!result)return;\n  const heading=result.querySelector('h2');if(heading && heading.textContent!=='Exam submitted')heading.textContent='Exam submitted';\n  function cleanAndStyle(){\n   // Keep only incorrect / unanswered items; never reveal the answer key.\n   const grid=document.getElementById('resultGrid');\n   if(grid){[...grid.children].forEach(card=>{\n    const label=card.querySelector('strong');\n    if(label && /·\\s*Correct\\s*$/.test(label.textContent) && !/Incorrect/.test(label.textContent)){card.remove();return;}\n    [...card.querySelectorAll('*')].forEach(el=>{if(el.children.length===0 && /^\\s*Correct answer\\s*:/i.test(el.textContent||''))el.remove();});\n    card.querySelectorAll('.small').forEach(el=>el.remove());\n   });}\n   const feedback=document.getElementById('feedback');\n   if(feedback){[...feedback.children].forEach(card=>{\n    if(card.querySelector('.correct')){card.remove();return;}\n    card.querySelectorAll('.small').forEach(el=>el.remove());\n    [...card.querySelectorAll('*')].forEach(el=>{if(el.children.length===0 && /^\\s*Correct answer\\s*:/i.test(el.textContent||''))el.remove();});\n    card.innerHTML=card.innerHTML.replace(/<br\\s*\\/?><span[^>]*>\\s*Correct answer:[\\s\\S]*?<\\/span>/gi,'');\n   });}\n   // Remove text-response downloads and secondary result actions.\n   result.querySelectorAll('#downloadBtn,button[id=\"editBtn\"]').forEach(el=>el.remove());\n   // Some older pages put result actions in a shared action row.\n   result.querySelectorAll('.bottom-actions').forEach(row=>{if(!row.querySelector('button:not(.celeste-print-result)'))row.remove();});\n   // Keep exactly one PDF button in the submitted-result panel.\n   document.querySelectorAll('body > .celeste-print-result').forEach(el=>el.remove());\n   let printBtn=result.querySelector('.celeste-print-result');\n   if(!printBtn){printBtn=document.createElement('button');printBtn.type='button';printBtn.className='celeste-print-result';printBtn.textContent='Print as PDF';printBtn.addEventListener('click',()=>window.print());result.appendChild(printBtn);}\n   else {if(printBtn.textContent!=='Print as PDF')printBtn.textContent='Print as PDF';printBtn.hidden=false;}\n  }\n  // Wait until the original grading script has rendered its result.\n  const form=document.querySelector('form');if(form)form.addEventListener('submit',()=>setTimeout(cleanAndStyle,80));\n  const observer=new MutationObserver(()=>{if(result.style.display!=='none' && result.offsetHeight)cleanAndStyle();});\n  observer.observe(result,{childList:true,subtree:true});\n  if(result.style.display!=='none' && result.offsetHeight)cleanAndStyle();\n }\n if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',setupResultView);else setupResultView();\n})();\n<\/script>\n<script>\n(function(){\n  window.print=function(){try{parent.postMessage({type:'celeste-print-request'},'*')}catch(e){}};\n  function h(){try{parent.postMessage({type:'celeste-height',height:document.documentElement.scrollHeight},'*')}catch(e){}}\n  addEventListener('load',h);setTimeout(h,250);setTimeout(h,1000);\n  if('ResizeObserver'in window)new ResizeObserver(h).observe(document.documentElement);\n})();\n<\/script></body></html>", "<!DOCTYPE html>\n<html lang=\"en\"><head><meta charset=\"UTF-8\"><meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>CELESTE English School — Units 15–16 Quiz</title>\n<style>\n:root{--navy:#172554;--blue:#2563eb;--ink:#1f2937;--muted:#64748b;--line:#dbe3ef;--green:#15803d;--red:#b91c1c}\n*{box-sizing:border-box}body{margin:0;background:#f3f6fb;color:var(--ink);font:16px/1.55 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}\nheader{background:linear-gradient(135deg,#172554,#1d4ed8);color:white;padding:28px 18px}.wrap{max-width:980px;margin:auto;padding:0 16px}header h1{margin:0;font-size:clamp(1.5rem,4vw,2.25rem)}header p{margin:5px 0 0;color:#dbeafe}\nmain{padding:22px 0 50px}.instructions,section,#results{background:white;border:1px solid var(--line);border-radius:14px;padding:18px;margin:16px 0;box-shadow:0 3px 12px #0f172a08}\nh2{font-size:1.15rem;margin:0 0 12px;color:var(--navy)}.sub,.small{color:var(--muted);font-size:.92rem}.sub{margin-top:-6px}.q{padding:11px 0;border-top:1px solid #edf1f7}.q:first-of-type{border-top:0}\ninput[type=text],select{font:inherit;border:1px solid #cbd5e1;border-radius:8px;padding:7px 10px;background:white;max-width:100%}input[type=text]{width:min(100%,500px)}.inline{width:155px!important;display:inline-block;margin:3px 2px}\n.choice{display:flex;gap:9px;align-items:flex-start;margin:7px 0}.choice input{margin-top:6px}\n.actions{display:flex;flex-wrap:wrap;gap:10px;margin:20px 0}.btn{border:0;border-radius:10px;padding:11px 17px;font:inherit;font-weight:650;cursor:pointer}.primary{background:var(--blue);color:white}.secondary{background:#e2e8f0;color:#0f172a}\n#results{display:none;border:2px solid var(--blue)}#score{font-size:1.5rem;font-weight:800;color:var(--navy)}.feedback{margin:10px 0;padding:10px 12px;border-radius:8px;background:#f8fafc}.correct{color:var(--green);font-weight:700}.incorrect{color:var(--red);font-weight:700}\narticle{border-left:4px solid #93c5fd;padding:12px 16px;background:#f8fbff;border-radius:0 10px 10px 0}\nfooter{text-align:center;color:var(--muted);padding:18px}@media(max-width:600px){section{padding:15px}.inline{width:120px!important}input[type=text]{width:100%}}\n</style><script>\n/* Flexible answer matching: ignore case/punctuation, accept common contractions and number words. */\nfunction celesteNorm(value){\n let s=String(value??'').toLowerCase().replace(/[’‘]/g,\"'\").trim();\n const contractions=[[/\\bcan't\\b/g,'cannot'],[/\\bcannot\\b/g,'cannot'],[/\\bwon't\\b/g,'will not'],[/\\bdon't\\b/g,'do not'],[/\\bdoesn't\\b/g,'does not'],[/\\bdidn't\\b/g,'did not'],[/\\bisn't\\b/g,'is not'],[/\\baren't\\b/g,'are not'],[/\\bwasn't\\b/g,'was not'],[/\\bweren't\\b/g,'were not'],[/\\bhaven't\\b/g,'have not'],[/\\bhasn't\\b/g,'has not'],[/\\bhadn't\\b/g,'had not'],[/\\bwouldn't\\b/g,'would not'],[/\\bshouldn't\\b/g,'should not'],[/\\bcouldn't\\b/g,'could not'],[/\\bit's\\b/g,'it is'],[/\\bthey're\\b/g,'they are'],[/\\bwe're\\b/g,'we are'],[/\\byou're\\b/g,'you are'],[/\\bI'm\\b/gi,'i am'],[/\\bhe's\\b/g,'he is'],[/\\bshe's\\b/g,'she is'],[/\\bthat's\\b/g,'that is'],[/\\bthere's\\b/g,'there is'],[/\\bwhat's\\b/g,'what is'],[/\\bwho's\\b/g,'who is'],[/\\bwhere's\\b/g,'where is'],[/\\bhow's\\b/g,'how is'],[/\\bthey've\\b/g,'they have'],[/\\bwe've\\b/g,'we have'],[/\\byou've\\b/g,'you have'],[/\\bI've\\b/g,'i have'],[/\\bI'll\\b/g,'i will'],[/\\byou'll\\b/g,'you will'],[/\\bwe'll\\b/g,'we will'],[/\\bthey'll\\b/g,'they will'],[/\\bhe'll\\b/g,'he will'],[/\\bshe'll\\b/g,'she will']];\n for(const [pattern,replacement] of contractions)s=s.replace(pattern,replacement);\n const nums={zero:'0',oh:'0',one:'1',two:'2',three:'3',four:'4',five:'5',six:'6',seven:'7',eight:'8',nine:'9',ten:'10',eleven:'11',twelve:'12',thirteen:'13',fourteen:'14',fifteen:'15',sixteen:'16',seventeen:'17',eighteen:'18',nineteen:'19',twenty:'20',thirty:'30',forty:'40',fifty:'50',sixty:'60',seventy:'70',eighty:'80',ninety:'90'};\n s=s.replace(/\\b(zero|oh|one|two|three|four|five|six|seven|eight|nine|ten|eleven|twelve|thirteen|fourteen|fifteen|sixteen|seventeen|eighteen|nineteen|twenty|thirty|forty|fifty|sixty|seventy|eighty|ninety)\\b/g,w=>nums[w]);\n return s.replace(/[^a-z0-9\\s']/g,' ').replace(/\\s+/g,' ').trim();\n}\n<\/script>\n</head><body>\n<div class=\"combined-nav\"><a href=\"../index.html\">← All units</a></div>\n<header><div class=\"wrap\"><h1>CELESTE English School</h1><p>Units 15–16 Quiz · Interactive exam</p></div></header>\n<main class=\"wrap\">\n<div class=\"instructions\"><strong>Instructions</strong><br>Complete all six sections. Section A listening audio can be played a maximum of <strong>two times</strong>. Submit the exam to see your score and the correct answers.</div>\n<form id=\"exam\">\n<section><h2>A. Listening — Phone Conversations</h2><p class=\"sub\">Listen to four phone conversations. Circle the correct words.</p>\n<label class=\"small\" for=\"audioFile\">Upload the listening audio file:</label><br><input id=\"audioFile\" type=\"file\" accept=\"audio/*\"><audio id=\"audio\" controls controlsList=\"nodownload noplaybackrate\" style=\"display:none;width:100%;margin-top:12px\"></audio><p id=\"playCount\" class=\"small\">Audio has not been uploaded. Once uploaded, it can be played twice.</p>\n<div class=\"q\"><strong>1. Linda is</strong> <label class=\"choice\"><input type=\"radio\" name=\"a1\" value=\"in class\"> in class</label><label class=\"choice\"><input type=\"radio\" name=\"a1\" value=\"at home\"> at home</label><label class=\"choice\"><input type=\"radio\" name=\"a1\" value=\"on her break\"> on her break</label> now.</div>\n<div class=\"q\"><strong>2. David is going to</strong> <label class=\"choice\"><input type=\"radio\" name=\"a2\" value=\"do laundry\"> do laundry</label><label class=\"choice\"><input type=\"radio\" name=\"a2\" value=\"study for a test\"> study for a test</label><label class=\"choice\"><input type=\"radio\" name=\"a2\" value=\"help his parents\"> help his parents</label> tomorrow.</div>\n<div class=\"q\"><strong>3. Jasmine is going to go</strong> <label class=\"choice\"><input type=\"radio\" name=\"a3\" value=\"on vacation\"> on vacation</label><label class=\"choice\"><input type=\"radio\" name=\"a3\" value=\"to a concert\"> to a concert</label><label class=\"choice\"><input type=\"radio\" name=\"a3\" value=\"to a movie\"> to a movie</label> tomorrow.</div>\n<div class=\"q\"><strong>4. James is going to</strong> <label class=\"choice\"><input type=\"radio\" name=\"a4\" value=\"get up early\"> get up early</label><label class=\"choice\"><input type=\"radio\" name=\"a4\" value=\"go to bed early\"> go to bed early</label><label class=\"choice\"><input type=\"radio\" name=\"a4\" value=\"see a movie\"> see a movie</label> tonight.</div>\n</section>\n<section><h2>B. Correct the Four Mistakes</h2><p class=\"sub\">Read Brenda's message and rewrite each incorrect part. There are four mistakes.</p>\n<article><p>Hi Kate,</p><p>Sorry I <strong>miss</strong> your call on Saturday. I wasn't home. I was in the country this weekend. The weather <strong>were</strong> beautiful. <strong>My parents there.</strong> I was all alone. <strong>It great.</strong></p><p>Talk to you soon,<br>Brenda</p></article>\n<div class=\"q\">1. <input type=\"text\" name=\"b1\" placeholder=\"Correct: miss\"></div>\n<div class=\"q\">2. <input type=\"text\" name=\"b2\" placeholder=\"Correct: were\"></div>\n<div class=\"q\">3. <input type=\"text\" name=\"b3\" placeholder=\"Correct: My parents there.\"></div>\n<div class=\"q\">4. <input type=\"text\" name=\"b4\" placeholder=\"Correct: It great.\"></div>\n</section>\n<section><h2>C. Complete the Questions</h2>\n<div class=\"q\">1. A: <input type=\"text\" name=\"c1\" placeholder=\"Complete the question\"><br>B: No, they weren't. My parents were born in Japan.</div>\n<div class=\"q\">2. A: <input type=\"text\" name=\"c2\" placeholder=\"Complete the question\"><br>B: I grew up in Tokyo.</div>\n<div class=\"q\">3. A: <input type=\"text\" name=\"c3\" placeholder=\"Complete the question\"><br>B: My first English teacher was Mr. Sato.</div>\n<div class=\"q\">4. A: <input type=\"text\" name=\"c4\" placeholder=\"Complete the question\"><br>B: I came to New York in 1998.</div>\n<div class=\"q\">5. A: <input type=\"text\" name=\"c5\" placeholder=\"Complete the question\"><br>B: It was a little scary.</div>\n</section>\n<section><h2>D. Pronouns and Prepositions</h2><p class=\"sub\">Complete the conversations with the correct pronouns and prepositions.</p>\n<div class=\"q\">1. A: Can I speak to Carl, please?<br>B: I'm sorry. He's <input class=\"inline\" type=\"text\" name=\"d1\"> his break.</div>\n<div class=\"q\">2. A: Hi. Are Lisa and Tom there?<br>B: Yes, but <input class=\"inline\" type=\"text\" name=\"d2a\"> can't come to the phone — they're <input class=\"inline\" type=\"text\" name=\"d2b\"> the yard.</div>\n<div class=\"q\">3. A: Is Beth in, please?<br>B: No, she's <input class=\"inline\" type=\"text\" name=\"d3a\"> the mall. Do you want to leave <input class=\"inline\" type=\"text\" name=\"d3b\"> a message?</div>\n</section>\n<section><h2>E. Circle the Correct Words</h2>\n<div class=\"q\">1. A: Do we have any food in the refrigerator?<br>B: No, we don't. I <select name=\"e1\"><option value=\"\">Choose...</option><option>'d like to</option><option>have to</option><option>want to</option></select> go to the supermarket.</div>\n<div class=\"q\">2. A: What are you going to do tonight?<br>B: I have a test tomorrow. I <select name=\"e2\"><option value=\"\">Choose...</option><option>'d like to</option><option>'d love to</option><option>need to</option></select> study.</div>\n<div class=\"q\">3. A: Let's see a movie.<br>B: I <select name=\"e3\"><option value=\"\">Choose...</option><option>'d like to</option><option>have to</option><option>need to</option></select>, but I can't.</div>\n<div class=\"q\">4. A: Do you <select name=\"e4a\"><option value=\"\">Choose...</option><option>have to</option><option>need to</option><option>want to</option></select> come to a party at my house?<br>B: Thanks. I <select name=\"e4b\"><option value=\"\">Choose...</option><option>'d love to</option><option>have to</option><option>need to</option></select>!</div>\n</section>\n<section><h2>F. Reading — The First American Woman in Space</h2><p class=\"sub\">Read the article. Then write questions for the answers.</p>\n<article><h3>The First American Woman in Space</h3>\n<p>Sally Ride was born on May 26, 1951, in Los Angeles, California. As a young girl, she wanted to be a tennis player, and she played tennis professionally as a teenager. She was a student at Stanford University and majored in English and physics. She finished college in 1977 and decided she wanted to be an astronaut. That year over 8,000 men and women wanted to enter the space program (NASA). Only 35 got in. Six were women, and one was Sally Ride.</p>\n<p>At NASA, Sally got a lot of training. In 1983, she took her first space flight, and became the first American woman in space. Sally Ride left NASA in 1987. She now teaches at Stanford University, and encourages other young women to study science and math.</p></article>\n<div class=\"q\">1. <input type=\"text\" name=\"f1\" placeholder=\"Write the question\"><br>In Los Angeles, California.</div>\n<div class=\"q\">2. <input type=\"text\" name=\"f2\" placeholder=\"Write the question\"><br>English and physics.</div>\n<div class=\"q\">3. <input type=\"text\" name=\"f3\" placeholder=\"Write the question\"><br>In 1987.</div>\n</section>\n<div class=\"actions\"><button class=\"btn primary\" type=\"submit\">Submit Exam &amp; Grade</button><button class=\"btn secondary\" type=\"button\" id=\"resetBtn\">Reset Answers</button></div>\n</form>\n<div id=\"results\" aria-live=\"polite\"><h2>Exam Results</h2><div id=\"score\"></div><p id=\"summary\"></p><div id=\"feedback\"></div><button class=\"btn primary\" type=\"button\" id=\"downloadBtn\">Download My Results (.txt)</button></div>\n</main><footer>CELESTE English School · Units 15–16 Quiz</footer>\n<script>\nconst audioInput=document.getElementById('audioFile'),audio=document.getElementById('audio'),playCount=document.getElementById('playCount');let plays=0,audioUrl=null,playingAllowed=false;\naudioInput.addEventListener('change',()=>{const file=audioInput.files[0];if(!file)return;if(audioUrl)URL.revokeObjectURL(audioUrl);audioUrl=URL.createObjectURL(file);audio.src=audioUrl;audio.style.display='block';plays=0;playingAllowed=true;audio.controls=true;playCount.textContent='Plays used: 0 / 2';audio.load();});\naudio.addEventListener('play',()=>{if(!playingAllowed||plays>=2){audio.pause();return;}plays++;playCount.textContent='Plays used: '+plays+' / 2';});\naudio.addEventListener('ended',()=>{if(plays>=2){playingAllowed=false;audio.controls=false;playCount.textContent='Maximum two plays reached.';}});\naudio.addEventListener('seeking',()=>{if(audio.currentTime>0)audio.currentTime=0;});\nconst key={\na1:'on her break',a2:'help his parents',a3:'on vacation',a4:'go to bed early',\nb1:'missed',b2:'was',b3:\"My parents weren't there.\",b4:\"It wasn't great.\",\nc1:'Were your parents born in the U.S.?',c2:'Where did you grow up?',c3:'Who was your first English teacher?',c4:'When did you come to New York?',c5:'How was your first day in the U.S.?',\nd1:'on',d2a:'they',d2b:'in',d3a:'at',d3b:'her',\ne1:'have to',e2:'need to',e3:\"'d like to\",e4a:'want to',e4b:\"'d love to\",\nf1:'Where was Sally Ride born?',f2:'What did Sally Ride major in?',f3:'When did Sally Ride leave NASA?'\n};\nconst normalize=s=>celesteNorm(s);const keys=Object.keys(key);let latestReport='';\nfunction esc(s){return String(s).replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]));}\ndocument.getElementById('exam').addEventListener('submit',ev=>{ev.preventDefault();let earned=0,total=keys.length,items=[];\nkeys.forEach(k=>{let el=document.querySelector('[name=\"'+k+'\"]'),val=el?.value||'',ok=normalize(val)===normalize(key[k]);\nif(k==='b3')ok=/^my parents weren't there$/.test(normalize(val));\nif(k==='b4')ok=/^it wasn't great$/.test(normalize(val));\nif(k==='c1')ok=/^were your parents born in the us$/.test(normalize(val));\nif(k==='c3')ok=/^who was your first english teacher$/.test(normalize(val));\nif(k==='f1')ok=/^where was sally ride born$/.test(normalize(val));\nif(k==='f2')ok=/^what did sally ride major in$/.test(normalize(val));\nif(k==='f3')ok=/^when did sally ride leave nasa$/.test(normalize(val));\nif(ok)earned++;items.push({label:k.toUpperCase(),val:val||'(blank)',ans:key[k],ok});});\nconst pct=Math.round(earned/total*100);document.getElementById('score').textContent=`${earned} / ${total} (${pct}%)`;document.getElementById('summary').textContent='Each blank or multiple-choice question is worth one point. Punctuation differences are ignored.';\nconst box=document.getElementById('feedback');box.innerHTML='';items.forEach(r=>{const d=document.createElement('div');d.className='feedback';d.innerHTML=`<strong>${r.label}</strong>: ${esc(r.val)} — <span class=\"${r.ok?'correct':'incorrect'}\">${r.ok?'Correct':'Incorrect'}</span><br><span class=\"small\">Correct answer: ${esc(r.ans)}</span>`;box.appendChild(d);});\nlatestReport=`CELESTE English School — Units 15–16 Quiz\\nScore: ${earned}/${total} (${pct}%)\\n\\n`+items.map(r=>`${r.label}: ${r.val} | ${r.ok?'Correct':'Incorrect'} | Correct answer: ${r.ans}`).join('\\n')+'\\n';\ndocument.getElementById('results').style.display='block';document.getElementById('results').scrollIntoView({behavior:'smooth'});});\ndocument.getElementById('downloadBtn').addEventListener('click',()=>{const url=URL.createObjectURL(new Blob([latestReport],{type:'text/plain;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download='units-15-16-quiz-results.txt';a.click();URL.revokeObjectURL(url);});\ndocument.getElementById('resetBtn').addEventListener('click',()=>{if(confirm('Reset all answers and start again?')){document.getElementById('exam').reset();document.getElementById('results').style.display='none';plays=0;playingAllowed=false;audio.pause();audio.removeAttribute('src');audio.style.display='none';audio.controls=true;playCount.textContent='Audio has not been uploaded. Once uploaded, it can be played twice.';latestReport='';}});\n<\/script><style>.combined-nav{padding:9px 16px;background:#fff;border-bottom:1px solid #ddd;font:700 14px system-ui}.combined-nav a{color:#8e302d;text-decoration:none}.celeste-print-result{display:flex;align-items:center;justify-content:center;width:max-content;max-width:100%;margin:18px auto;padding:12px 18px;border:0;border-radius:9px;background:#8e302d;color:#fff;font-weight:800;cursor:pointer}@media print{.combined- ,#feedback .feedback{box-sizing:border-box;padding:15px;border:1px solid #f0b7b7;border-left:5px solid #c94a4a;border-radius:12px;background:#fff8f8;line-height:1.55;overflow-wrap:anywhere}\n#resultGrid .result-item strong,#feedback .feedback strong{display:block;margin-bottom:5px;color:#9f2f2f}\n.celeste-print-result{display:flex;align-items:center;justify-content:center;gap:8px;width:max-content;max-width:100%;margin:22px auto 0;padding:13px 22px;border:0;border-radius:10px;background:#8e302d;color:#fff;font-size:1rem;font-weight:800;cursor:pointer;box-shadow:0 4px 12px rgba(142,48,45,.2)}\n.celeste-print-result:hover{background:#702421}\n@media(max-width:600px){#result,#results{margin:16px 8px;padding:18px;border-radius:14px}#resultGrid,#feedback{grid-template-columns:1fr}.celeste-print-result{width:max-content;max-width:100%;margin-left:auto;margin-right:auto}}\n@media print{body{background:#fff!important}#result,#results{max-width:none;margin:0;padding:0;border:0;border-radius:0;box-shadow:none}#resultGrid,#feedback{display:block}#resultGrid .result-item,#feedback .feedback{break-inside:avoid;margin:0 0 10px}.combined-nav,.celeste-print-result,button,input[type=file],audio,footer{display:none!important}}\n</style>\n<script>\n(function(){\n function setupResultView(){\n  const result=document.getElementById('result')||document.getElementById('results');\n  if(!result)return;\n  const heading=result.querySelector('h2');if(heading && heading.textContent!=='Exam submitted')heading.textContent='Exam submitted';\n  function cleanAndStyle(){\n   // Keep only incorrect / unanswered items; never reveal the answer key.\n   const grid=document.getElementById('resultGrid');\n   if(grid){[...grid.children].forEach(card=>{\n    const label=card.querySelector('strong');\n    if(label && /·\\s*Correct\\s*$/.test(label.textContent) && !/Incorrect/.test(label.textContent)){card.remove();return;}\n    [...card.querySelectorAll('*')].forEach(el=>{if(el.children.length===0 && /^\\s*Correct answer\\s*:/i.test(el.textContent||''))el.remove();});\n    card.querySelectorAll('.small').forEach(el=>el.remove());\n   });}\n   const feedback=document.getElementById('feedback');\n   if(feedback){[...feedback.children].forEach(card=>{\n    if(card.querySelector('.correct')){card.remove();return;}\n    card.querySelectorAll('.small').forEach(el=>el.remove());\n    [...card.querySelectorAll('*')].forEach(el=>{if(el.children.length===0 && /^\\s*Correct answer\\s*:/i.test(el.textContent||''))el.remove();});\n    card.innerHTML=card.innerHTML.replace(/<br\\s*\\/?><span[^>]*>\\s*Correct answer:[\\s\\S]*?<\\/span>/gi,'');\n   });}\n   // Remove text-response downloads and secondary result actions.\n   result.querySelectorAll('#downloadBtn,button[id=\"editBtn\"]').forEach(el=>el.remove());\n   // Some older pages put result actions in a shared action row.\n   result.querySelectorAll('.bottom-actions').forEach(row=>{if(!row.querySelector('button:not(.celeste-print-result)'))row.remove();});\n   // Keep exactly one PDF button in the submitted-result panel.\n   document.querySelectorAll('body > .celeste-print-result').forEach(el=>el.remove());\n   let printBtn=result.querySelector('.celeste-print-result');\n   if(!printBtn){printBtn=document.createElement('button');printBtn.type='button';printBtn.className='celeste-print-result';printBtn.textContent='Print as PDF';printBtn.addEventListener('click',()=>window.print());result.appendChild(printBtn);}\n   else {if(printBtn.textContent!=='Print as PDF')printBtn.textContent='Print as PDF';printBtn.hidden=false;}\n  }\n  // Wait until the original grading script has rendered its result.\n  const form=document.querySelector('form');if(form)form.addEventListener('submit',()=>setTimeout(cleanAndStyle,80));\n  const observer=new MutationObserver(()=>{if(result.style.display!=='none' && result.offsetHeight)cleanAndStyle();});\n  observer.observe(result,{childList:true,subtree:true});\n  if(result.style.display!=='none' && result.offsetHeight)cleanAndStyle();\n }\n if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',setupResultView);else setupResultView();\n})();\n<\/script>\n<script>\n(function(){\n  window.print=function(){try{parent.postMessage({type:'celeste-print-request'},'*')}catch(e){}};\n  function h(){try{parent.postMessage({type:'celeste-height',height:document.documentElement.scrollHeight},'*')}catch(e){}}\n  addEventListener('load',h);setTimeout(h,250);setTimeout(h,1000);\n  if('ResizeObserver'in window)new ResizeObserver(h).observe(document.documentElement);\n})();\n<\/script></body></html>"];
const LABELS=["Units 1–2", "Units 3–4", "Units 5–6", "Units 7–8", "Units 9–10", "Units 11–12", "Units 13–14", "Units 15–16"];
const host=document.getElementById('units');
const frames=[];
UNIT_DOCS.forEach((doc,i)=>{
 const section=document.createElement('section');section.className='unit';
 const h=document.createElement('h2');h.textContent=LABELS[i];section.appendChild(h);
 const frame=document.createElement('iframe');frame.title=LABELS[i];frame.loading='lazy';frame.setAttribute('sandbox','allow-scripts allow-forms allow-same-origin allow-modals');
 section.appendChild(frame);host.appendChild(section);frames.push(frame);
 frame.srcdoc=doc;
});
document.getElementById('status').textContent='All 8 sections are included. Scroll down to complete Units 1–16.';
window.addEventListener('message',e=>{
 if(!e.data)return;
 const frame=frames.find(f=>f.contentWindow===e.source);
 if(frame&&e.data.type==='celeste-height'&&Number.isFinite(e.data.height))frame.style.height=Math.max(560,e.data.height+8)+'px';
});
let locked=false;
document.getElementById('submitAll').addEventListener('click',()=>{
 if(locked)return;
 if(!confirm('Submit the complete exam now?'))return;
 locked=true;
 frames.forEach(f=>{
  try{
   const d=f.contentDocument;
   const form=d&&d.querySelector('form');
   if(form){if(form.requestSubmit)form.requestSubmit();else form.dispatchEvent(new Event('submit',{bubbles:true,cancelable:true}));}
  }catch(err){}
 });
 const b=document.getElementById('submitAll');b.textContent='Preparing your PDF…';b.disabled=true;
 setTimeout(()=>{b.disabled=false;b.textContent='Print / Save as PDF';b.onclick=()=>window.print();window.print();},1800);
});
